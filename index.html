<style>
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one phone-width column styled like a boarding pass and a WhatsApp thread, passport green and stamp gold */
:root{
  --paper:#F8F4E9; --card:#FFFEFA; --ink:#1B332B; --muted:#6B7A72; --line:#DCE2D7;
  --green:#102F28; --green2:#1C4C3D; --green-ink:#FFFFFF; --gold:#D4A451; --accent:#A46F26; --bubble:#E9F1E8;
  --good:#2D7A52; --bad:#B4483A;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1C17; --card:#15281F; --ink:#EEF2EA; --muted:#9AAAA0; --line:#2A3D33;
  --green:#1C4C3D; --green2:#276348; --green-ink:#FFFFFF; --gold:#E8BB69; --accent:#E8BB69; --bubble:#1A3328;
  --good:#5CC48A; --bad:#E7826F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1C17; --card:#15281F; --ink:#EEF2EA; --muted:#9AAAA0; --line:#2A3D33;
  --green:#1C4C3D; --green2:#276348; --green-ink:#FFFFFF; --gold:#E8BB69; --accent:#E8BB69; --bubble:#1A3328;
  --good:#5CC48A; --bad:#E7826F; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;min-width:0}
.rail{display:none}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:100vh}
  .rail{display:flex;flex-direction:column;background:var(--green);color:#fff;padding:36px 30px;position:sticky;top:0;height:100vh;overflow:hidden}
  .rail::after{content:"\2708";font-size:300px;position:absolute;bottom:-110px;left:-40px;color:rgba(255,255,255,.04);transform:rotate(-25deg);pointer-events:none}
  .rail .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#E8BB69}
  .rail .rbrand{font-family:var(--display);font-size:40px;line-height:1.05;margin:20px 0 12px;letter-spacing:-.02em;font-weight:800}
  .rail .rbrand span{color:#E8BB69}
  .rail .rsub{color:#BFCFC5;line-height:1.7;font-size:15px;margin:0}
  .rail .rstamp{border:1px solid #527163;padding:12px 14px;border-radius:8px;margin-top:32px;width:max-content;transform:rotate(-4deg);font-size:11px;letter-spacing:.18em;color:#E8BB69}
  .rail .rfoot{margin-top:auto;font-size:12px;color:#A5B7AE;position:relative;z-index:1;line-height:1.6}
  .main{padding-block:44px 60px}
  .wrap{max-width:560px}
}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Pass header */
.pass{background:var(--green);color:var(--green-ink);border-radius:14px;padding:14px 16px;display:grid;gap:10px;position:relative;overflow:hidden}
.pass::after{content:"";position:absolute;right:-18px;top:50%;width:36px;height:36px;border-radius:50%;background:var(--paper);transform:translateY(-50%)}
.pass-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-right:22px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em}
.day{font-family:var(--mono);font-size:13px;letter-spacing:.08em;opacity:.9}
.route{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-right:22px}
.stat{display:grid;gap:3px;min-width:0}
.stat b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--green-ink) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s ease}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .5s ease}

/* Scene */
.scene{display:grid;gap:14px}
.when{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.narr{font-size:18px;line-height:1.55;text-wrap:pretty}
.thread{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:800}
.who b{font-weight:700}
.who small{display:block;color:var(--muted);font-size:12px}
.bubble{background:var(--bubble);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:16px;max-width:92%}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:600;font-size:16px;display:flex;gap:12px;align-items:center;transition:border-color .15s,transform .1s}
.choice:hover{border-color:var(--green)}
.choice:active{transform:scale(.99)}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:700;flex:none}
.result{background:var(--card);border-left:3px solid var(--gold);border-radius:4px 12px 12px 4px;padding:12px 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.primary{background:var(--green);color:var(--green-ink);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;width:100%}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:13px 18px;font-weight:600;width:100%}

/* Intro */
.intro{display:grid;gap:18px;padding-top:8px}
.stamp{justify-self:start;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:1.5px solid var(--gold);padding:4px 10px;border-radius:4px;transform:rotate(-3deg)}
.intro h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,60px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.intro h1 em{font-style:italic;color:var(--accent);display:block;font-size:.48em;letter-spacing:0;margin-top:10px;font-weight:700}
.intro p{margin:0;font-size:17px;color:var(--muted);max-width:38ch}
.kit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kit div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
.kit b{font-family:var(--mono);font-size:15px}
.kit span{font-size:12px;color:var(--muted)}

/* Ending */
.verdict{background:var(--green);color:var(--green-ink);border-radius:16px;padding:20px 18px;display:grid;gap:12px}
.verdict .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.verdict h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.08;margin:0;text-wrap:balance}
.verdict p{margin:0;font-size:17px}
.receipts{display:grid;gap:6px;border-top:1px dashed color-mix(in srgb,var(--green-ink) 40%,transparent);padding-top:12px;font-size:15px}
.receipts div::before{content:"› ";color:var(--gold);font-weight:700}
.final{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-family:var(--mono);font-size:13px}
.final div{display:grid;gap:2px}
.final span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{font-size:14px;color:var(--good);min-height:20px;text-align:center}
.routes{display:grid;gap:10px}
.route-btn{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:2px}
.route-btn:hover{border-color:var(--green)}
.route-btn b{font-family:var(--display);font-size:17px;color:var(--green)}
.route-btn span{font-size:14px;color:var(--muted)}
.route-btn.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.local{background:var(--bubble);border-radius:12px;padding:10px 12px;font-size:15px;display:grid;gap:2px}
.local b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.journey-line{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700}
.foot.small{font-size:11px;opacity:.85}
.backbtn{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:6px 0;text-align:left}
.backbtn:hover{color:var(--green)}
.share{display:grid;gap:8px}
.share-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sbtn{display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:700;font-size:14px;cursor:pointer;min-width:0}
.sbtn:hover{border-color:var(--green)}
.sbtn.wa{background:var(--green);color:var(--green-ink);border-color:var(--green)}
@media (max-width:360px){.share-row{grid-template-columns:repeat(2,1fr)}}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:16px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green);flex:none}
.how{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green)}
.how-body{display:grid;gap:10px;margin-top:10px;font-size:15px}
.how-body p{margin:0;color:var(--ink);font-size:15px}
.how dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.how dt{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;padding-top:2px}
.how dd{margin:0}
.art{display:flex;justify-content:center;background:var(--bubble);border-radius:14px;padding:6px 0}
.art svg{width:100%;max-width:240px;height:auto;display:block}
.f-ink{fill:var(--ink)} .f-paper{fill:var(--card)} .f-green{fill:var(--green)} .f-gold{fill:var(--gold)} .f-goldlight{fill:color-mix(in srgb,var(--gold) 70%,#fff)} .f-line{fill:var(--line)} .f-bad{fill:var(--bad)}
.s-gold{stroke:var(--gold)} .s-green{stroke:var(--green)} .s-ink{stroke:var(--ink)} .s-line{stroke:var(--muted)} .s-paper{stroke:var(--card)}
.a-shake{animation:shake 1.2s ease-in-out infinite;transform-origin:80px 45px}
.a-pulse{animation:pulse 1.2s ease-in-out infinite}
.a-land{animation:land 1.6s cubic-bezier(.2,.8,.2,1) both}
.a-drop1{animation:drop .6s ease-out both}.a-drop2{animation:drop .6s .15s ease-out both}.a-drop3{animation:drop .6s .3s ease-out both}
.a-bob{animation:bob 1.6s ease-in-out infinite}
.a-fall{animation:fall 1.4s linear infinite}
.a-spin{animation:spin 12s linear infinite}
.a-steam{animation:pulse 1.8s ease-in-out infinite}
.a-road{animation:road .8s linear infinite}
@keyframes shake{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}75%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}85%{transform:rotate(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes land{from{transform:translate(-70px,-30px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes fall{from{transform:translateY(-14px);opacity:0}30%{opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes road{to{stroke-dashoffset:-24}}
.stat.up b{animation:statup .9s ease}
.stat.down b{animation:statdown .7s ease}
@keyframes statup{0%{transform:scale(1)}30%{transform:scale(1.25);color:var(--gold)}100%{transform:scale(1)}}
@keyframes statdown{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.choice{transition:border-color .15s,transform .12s,background .15s}
.choice:hover{transform:translateX(3px);background:var(--bubble)}
.cardwrap img{width:100%;border-radius:14px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.art *{animation:none!important}.stat.up b,.stat.down b{animation:none}}
.bar{position:relative}
.bar::after{content:"";position:absolute;left:60%;top:-2px;bottom:-2px;width:2px;background:color-mix(in srgb,var(--green-ink) 70%,transparent)}
.sheet{display:grid;gap:10px}
.meter{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px 12px 12px 6px;padding:10px 12px;display:grid;gap:6px}
.meter.high{border-left-color:var(--good)} .meter.mid{border-left-color:var(--gold)} .meter.low{border-left-color:var(--bad)}
.meter-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter-top b{font-weight:700}
.meter-top .val{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.meter-top .tag{margin-left:auto;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.meter.high .tag{color:var(--good)} .meter.mid .tag{color:var(--gold)} .meter.low .tag{color:var(--bad)}
.meter p{margin:0;font-size:15px;color:var(--muted)}
.mbar{position:relative;height:6px;border-radius:3px;background:var(--line)}
.mbar i{display:block;height:100%;border-radius:3px;background:var(--muted)}
.meter.high .mbar i{background:var(--good)} .meter.mid .mbar i{background:var(--gold)} .meter.low .mbar i{background:var(--bad)}
.mbar em.cap{opacity:.35;background:var(--bad)}
.mbar em{position:absolute;left:60%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.bench{margin:0;font-size:14px;color:var(--muted)}
.lesson{background:var(--bubble);border-radius:12px;padding:12px 14px;font-weight:600}
.a-wave{animation:wave 1s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}
.a-pop{animation:popin .7s cubic-bezier(.2,1.6,.4,1) both;transform-origin:80px 44px}
@keyframes popin{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.choice{border-radius:13px;padding:16px 16px;box-shadow:0 1px 0 rgba(16,47,40,.03)}
.choice .cl{flex:1;min-width:0}
.choice .k{color:var(--accent)}
.choice .arrow{color:var(--green2);font-size:18px;flex:none;transition:transform .15s}
.choice:hover .arrow{transform:translate(2px,-2px)}
.stamp{color:var(--accent);border-color:var(--accent)}
.how dt{color:var(--accent)}
.when{letter-spacing:.16em;font-weight:800}
.result{background:#F8F3E8;border-left-color:#BD8E3E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .result{background:var(--card)}}
:root[data-theme="dark"] .result{background:var(--card)}
.verdict{box-shadow:0 16px 40px rgba(16,47,40,.15)}
.f-cloud{fill:var(--card);stroke:var(--muted);stroke-width:2}
.storylink{display:block;text-align:center;background:var(--bubble);color:var(--green2);font-weight:700;text-decoration:none;border-radius:12px;padding:14px 16px}
.storylink:hover{text-decoration:underline}
.route-panel{display:grid;gap:10px;background:var(--card);border:1.5px solid var(--green2);border-top:0;border-radius:0 0 12px 12px;margin-top:-12px;padding:16px 14px 14px}
.route-btn.on{border-radius:12px 12px 0 0}
.check.daily{align-items:flex-start;background:var(--bubble);border-radius:12px;padding:12px;font-weight:500;font-size:14px}
.check.daily b{font-size:15px}
.check.daily input{margin-top:3px}
.gloss{margin:0;display:grid;gap:8px}
.gloss dt{font-weight:800;color:var(--green2)}
.gloss dd{margin:-4px 0 4px;color:var(--muted);font-size:15px}
.glossbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;text-align:left;padding:4px 0;text-decoration:underline}
.overlay{position:fixed;inset:0;background:rgba(16,47,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-panel{background:var(--card);color:var(--ink);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:16px 18px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:-16px;background:var(--card);padding-top:4px}
.xbtn{background:var(--bubble);border:0;border-radius:999px;width:34px;height:34px;font-weight:700}

.coll-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.coll-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.coll-bar i{display:block;height:100%;background:var(--gold)}
.coll-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vbadge{border-radius:10px;padding:10px;display:grid;gap:3px;position:relative;min-width:0}

.vbadge small{font-size:12px;color:var(--muted);line-height:1.35}
.vbadge.got{background:var(--bubble)}
.vbadge.got b{color:var(--green2)}

.vbadge.locked b{color:var(--muted);letter-spacing:.2em}
.vbadge.cur{outline:2px solid var(--gold)}
.newtag{position:absolute;top:-8px;right:8px;background:var(--gold);color:#1B332B;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.coll-mini{background:var(--bubble);border-radius:12px;padding:10px 12px;font-size:15px;text-align:center}
@media (max-width:360px){.coll-grid{grid-template-columns:1fr}}
.foot{font-size:13px;color:var(--muted);text-align:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i,.progress i{transition:none}}
#soundbtn{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid var(--line, rgba(0,0,0,.12));background:var(--card);font-size:18px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
body{padding-bottom:64px}

function placeFrom(arr){ const [name,cost,cold,car,town,note] = arr; return {name, cost, cold, car:!!car, town: town||name, note: note||''}; }
function places(key){
  if(key==='us') return US_PLACES.map(placeFrom);
  if(key==='ca') return CA_PLACES.map(placeFrom);
  const out = [];
  for(const g in UK_GROUPS) for(const n of UK_GROUPS[g]){
    const cost = UK_COST3.includes(n)?3:UK_COST1.includes(n)?1:2;
    out.push({name:n, group:g, cost, cold:1, car:false, town:UK_TOWN[n]||n, note:UK_NOTE[n]||''});

  return out;
}

  choices:[
   {l:`Call a friend still in ${O()}`, fx:{home:3, peace:6}, r:"She says the office misses you and that fuel is now unbelievable. You hang up feeling missed and very sure about the fuel."},

/* ---------- How you japa'd ---------- */
const PATHS = {
  work:    {us:'With a job offer or a green card', uk:'On a skilled worker visa', ca:'With permanent residence', mult:1},
  scholar: {all:'On a full scholarship', mult:0.6},
  partial: {all:'With partial funding', mult:0.55},
  study:   {all:'Self-funded, without the full fees', mult:0.5},
  care:    {uk:'On a care worker visa', mult:0.5},
  lottery: {us:'Won the visa lottery', mult:0.8},
  visitor: {us:'Came on a visitor visa and stayed', uk:'Came to visit and stayed', ca:'Came to visit and stayed', mult:0.6}
};
function pathOptions(rk){ return Object.entries(PATHS).filter(([k,v])=>v.all||v[rk]).map(([k,v])=>[k, v[rk]||v.all]); }
const P = () => S.path || 'work';
const STU = () => ['scholar','partial','study'].includes(P());
const SOLD = () => !!S.sold;
const FUND = () => S.fund || (S.sold ? 'sold' : 'savings');
const soldLine = () => SOLD() ? `You sold your car, your shop, and your land in ${O()} to come, so there is nothing to go back to. ` : FUND()==='borrowed' ? `You borrowed ₦5 million from your cooperative society to make this move. ` : FUND()==='kept' ? `You rented out your house in ${O()} to help pay for this move. ` : '';
const FEES = () => A(6000);

      ? `Reminder: your scholarship covers half your tuition. The remaining ${M(FEES()/2)} is due in 14 days. Students who do not pay will be withdrawn from their programme.`

       {l:"Beg for a payment plan, politely", fx:{peace:4, future:6}, set:{fees:'plan'}, r:"The international student office agrees to three instalments. It is not freedom, but it is breathing room."},

    ][pickV('W',3)]);
  }
  if(p==='lottery'){
    out.push({day:12, from:c.aunty, sub:`Family elder · ${c.home}`, text:`Congratulations on your lottery o! How much did they give you? We have fixed a family meeting for Sunday.`,

       {l:`Pay the ${N(500)} immediately`, fx:{cash:-A(500), home:4, peace:2}, set:{loan:'paid'}, r:"The neighbours are still talking, but at least now they are saying you paid."},
       {l:"Call the secretary and agree a payment plan", fx:{peace:3, future:3, home:-2}, set:{loan:'plan'}, r:"Monthly instalments, signed and witnessed. Your mother can face the neighbours again."},
       {l:"Tell her you will sort it soon", fx:{home:-8, peace:-6}, r:"\"Soon,\" she repeats slowly, like a warning."}]});
  }
  if(f==='kept'){
    out.push([
     {day:19, from:c.cousin, sub:`Looking after your house · ${c.home}`, text:`Your tenant has not paid rent for three months. He says he will pay "when the economy improves".`,
      choices:[
       {l:`Pay an agent ${N(80)} to manage it properly`, fx:{cash:-A(80), future:8, peace:3}, set:{house:'managed'}, r:"The agent collects two months' rent in a week. You wonder why you did not do this first."},
       {l:"Wait for the economy to improve", fx:{peace:-5, future:-4}, set:{house:'waiting'}, r:"The economy has not improved. Neither has the tenant."},
       {l:`Send ${c.cousin} to have a word with him`, fx:{home:3, peace:-2, future:3}, set:{house:'cousin'}, r:`${c.cousin} goes with two uncles and a very serious face. Rent arrives the next morning.`}]},
     {day:19, from:c.sib, sub:`Your brother · ${c.home}`, text:"Your tenant don pack out. I don move into the house so that thieves no go break in. I dey protect am for you. Light bill don come sha, you go pay?",

       {l:"Rent it out properly through an agent", fx:{cash:-A(80), future:8, home:-4}, set:{house:'managed'}, r:"Your brother moves back to his own place, offended but alive. A new tenant moves in, and the rent starts flowing again."}]}
    ][pickV('K',2)]);
  }
  return out;
};

/* ---------- Stranded at arrivals ---------- */
const arrival = () => { const port = {us: L.name==='Maryland' ? 'BWI' : 'the airport', uk:'Heathrow', ca: T()==='Toronto' ? 'Pearson' : 'the airport'}[R.key];
  return {day:1, when: s => s.landing===1 && pickV('air',3)===1, text:`You land at ${port}. The man who arranged your trip said someone would pick you up. He is not picking up his calls. The people you know are hours away, and the only person in ${T()} is at work until 6pm.`,
  choices:[
   {l:"Wait for your friend to close from work", fx:{peace:-6, home:2}, r:"Three hours on an airport bench with two suitcases and a dying phone. When she arrives, you hug her like family."},
   {l:`Take a taxi, ${M(A(85))}`, fx:{cash:-A(85), peace:3}, r:"The driver plays Afrobeats when he hears your accent. It is the best money you will spend this month."},
   {l:"Keep calling the man who arranged it", fx:{peace:-9}, r:"Fourteen calls. He replies at midnight, \"Sorry, network.\" That is your first lesson about people who \"arrange things\"."}]}; };

function scenes(){
  const base = [arrival()].concat(R.key==='us' ? US() : R.key==='uk' ? UK() : CA());
  return base.concat(routeAlts(), pathScenes(), fundScenes(), [familyGroup(), mishap(), smallWin(), countryMoment(), padaScene()]).map((sc,i)=>({sc,i})).sort((a,b)=>a.sc.day-b.sc.day || a.i-b.i).map(x=>x.sc);
}

      else { text = P()==='scholar' ? "Your research assistant pay arrives. £300. Your stipend is still \"processing\"." : "Your research assistant pay arrives. £300. Your supervisor says you are doing well."; fx = {cash:300}; }
    } else {

function apply(fx){ for(const k in fx){ S[k] += fx[k]; if(k!=='cash') S[k] = Math.max(0, Math.min(100, S[k])); } }
function money(n){ return (n<0?'-':'') + M(n); }
function chips(fx){
  const names = {cash:'Cash', peace:'Peace', home:'Home', future:'Future'};
  return Object.keys(fx).filter(k=>fx[k]).map(k=>{
    const v = fx[k], up = v>0;
    const val = k==='cash' ? (up?'+':'-')+M(v) : (up?'+':'')+v;
    return `<span class="chip ${up?'up':'down'}">${names[k]} ${val}</span>`;
  }).join('');
}
function header(day){
  const pct = Math.min(100, (day/30)*100);
  const cls = k => !shown ? '' : S[k] > shown[k] ? ' up' : S[k] < shown[k] ? ' down' : '';
  const c = {cash:cls('cash'), peace:cls('peace'), home:cls('home'), future:cls('future')};
  shown = {cash:S.cash, peace:S.peace, home:S.home, future:S.future};
  const b = v => `<div class="bar"><i style="width:${v}%"></i></div>`;
  return `<div class="pass">
    <div class="pass-top"><div class="brand">LANDED</div><div class="day">DAY ${String(day).padStart(2,'0')} / 30</div></div>
    <div class="route">${S.trail.map(t=>t.code).join(' → ')} → ${R.country} · ${L.town===L.name?L.name:L.town+', '+L.name}</div>
    <div class="stats">
      <div class="stat${c.cash}"><span>Cash</span><b>${money(S.cash)}</b></div>
      <div class="stat${c.peace}"><span>Peace</span><b>${S.peace}</b>${b(S.peace)}</div>
      <div class="stat${c.home}"><span>Home</span><b>${S.home}</b>${b(S.home)}</div>
      <div class="stat${c.future}"><span>Future</span><b>${S.future}</b>${b(S.future)}</div>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
}
function nextIndex(from){
  SCENES = scenes();
  let i = from;
  while(i < SCENES.length && SCENES[i].when && !SCENES[i].when(S)) i++;
  return i;
}

function placeOptions(rk){
  const list = places(rk), def = ROUTES[rk].def;
  if(rk!=='uk') return list.map(p=>`<option${p.name===def?' selected':''}>${p.name}</option>`).join('');
  let html = '';
  for(const g in UK_GROUPS){
    html += `<optgroup label="${g}">` + list.filter(p=>p.group===g).map(p=>`<option${p.name===def?' selected':''}>${p.name}</option>`).join('') + `</optgroup>`;
  }
  return html;
}

/* ---------- Sound (all synthesised, no audio files) ---------- */
const SFX = (() => {
  let ctx = null, master = null, on = true;
  try { on = localStorage.getItem('nyhl-sound') !== 'off'; } catch(e) {}
  const ensure = () => {
    if(!on) return null;
    try {
      if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination); }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch(e) { return null; }
  };
  const tone = (f, dur, {type='sine', vol=0.3, at=0, to=null, attack=0.005} = {}) => {
    const c = ensure(); if(!c) return; const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain(); o.type = type;
    o.frequency.setValueAtTime(f, t); if(to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  const noise = (dur, {at=0, vol=0.2, from=400, to=2400, q=0.8} = {}) => {
    const c = ensure(); if(!c) return; const t = c.currentTime + at;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur);
  };
  // a talking-drum hit: a low skin tone whose pitch bends, plus a little slap
  const drum = (at = 0, from = 150, to = 95, vol = 0.5) => { tone(from, 0.28, {at, to, vol, attack: 0.003}); noise(0.05, {at, vol: 0.12, from: 1800, to: 900, q: 1.5}); };
  const buzz = () => { try { if(navigator.vibrate) navigator.vibrate(12); } catch(e) {} };
  return {
    get on(){ return on; },
    toggle(){ on = !on; try { localStorage.setItem('nyhl-sound', on ? 'on' : 'off'); } catch(e) {} if(on) this.tap(); return on; },
    tap(){ tone(620, 0.06, {type:'triangle', vol:0.12}); buzz(); },
    land(){ noise(1.1, {vol:0.18, from:300, to:2600}); drum(0.75, 130, 190); drum(0.98, 150, 100); drum(1.2, 120, 170, 0.6); },
    ping(){ tone(1046, 0.12, {vol:0.16}); tone(1568, 0.22, {vol:0.14, at:0.09}); },
    coinIn(){ tone(988, 0.08, {type:'square', vol:0.07}); tone(1319, 0.32, {type:'square', vol:0.07, at:0.07}); },
    coinOut(){ tone(740, 0.12, {type:'triangle', vol:0.16}); tone(523, 0.14, {type:'triangle', vol:0.16, at:0.1}); tone(392, 0.26, {type:'triangle', vol:0.14, at:0.2, to:300}); },
    good(){ tone(523, 0.14, {type:'triangle', vol:0.14}); tone(659, 0.14, {type:'triangle', vol:0.14, at:0.08}); tone(784, 0.28, {type:'triangle', vol:0.14, at:0.16}); },
    ouch(){ tone(110, 0.35, {vol:0.4, to:70}); noise(0.12, {vol:0.08, from:600, to:200}); },
    meh(){ tone(392, 0.12, {type:'triangle', vol:0.1}); tone(370, 0.22, {type:'triangle', vol:0.1, at:0.11}); },
    verdict(happy){
      [0, 0.14, 0.28, 0.36, 0.44].forEach((t, i) => drum(t, i % 2 ? 160 : 120, i % 2 ? 100 : 170, 0.45));
      const notes = happy ? [523, 659, 784, 1046] : [440, 523, 659, 587];
      notes.forEach((f, i) => tone(f, i === 3 ? 0.7 : 0.2, {type:'triangle', vol:0.15, at:0.62 + i * 0.13}));
      if(happy) tone(1568, 0.5, {vol:0.06, at:1.05});
    },
    // what a result sounds like, read from its effects
    result(fx){
      fx = fx || {}; const cash = fx.cash || 0, mood = (fx.peace || 0) + (fx.home || 0) + (fx.future || 0);
      if(cash > 0) return this.coinIn();
      if(cash < 0) return this.coinOut();
      if(mood <= -8) return this.ouch();
      if(mood >= 6) return this.good();
      return this.meh();
    }
  };
})();

    if(go) go.onclick = ()=>{ SFX.land(); pick.path = document.getElementById('path').value; pick.fund = document.getElementById('fund').value; pick.daily = document.getElementById('daily').checked; pick.duo = +document.getElementById('duo').value; begin(rk, document.getElementById('place').value); render(); scrollTo(0,0); };
    const ps = document.getElementById('path'); if(ps) ps.onchange = e => { pick.path = e.target.value; };
    const fb = document.getElementById('fund'); if(fb) fb.onchange = e => { pick.fund = e.target.value; };
    const db = document.getElementById('daily'); if(db) db.onchange = e => { pick.daily = e.target.checked; };
    return;
  }
  if(phase==='end'){ return renderEnd(app); }
  SCENES = scenes();
  const sc = SCENES[idx];
  if(phase==='scene' && sc.auto){
    const ev = autoEvent(sc.auto);
    apply(ev.fx); last = {r:ev.text, fx:ev.fx, auto:true}; phase = 'result'; setTimeout(()=>SFX.result(ev.fx), 120);
  }
  if(phase==='scene'){
    const list = typeof sc.choices==='function' ? sc.choices(S) : sc.choices;
    const ord = list.map((c,i)=>i).sort((a,b)=> hashStr((S.seed||0)+'|'+sc.day+'|'+list[a].l) - hashStr((S.seed||0)+'|'+sc.day+'|'+list[b].l));
    const note = sc.day===1 && !sc.from && idx===nextIndex(0) ? `${S.landing>1?`<div class="local"><b>Landing number ${S.landing}</b>You leave ${S.trail[S.trail.length-1].town} and start again. Your peace, family standing, and future come with you. Your savings reset to what you managed to bring.</div>`:''}<div class="local"><b>About ${L.name}</b>${localNote()}</div>` : '';
    app.innerHTML = header(sc.day) + `<div class="scene fade">${art(sc)}${intro(sc)}${note}<div class="choices">${ord.map((i,pos)=>{ const c=list[i]; return `<button class="choice" data-i="${i}"><span class="k">${'ABCD'[pos]}</span><span class="cl">${c.l}</span><span class="arrow" aria-hidden="true">↗</span></button>`; }).join('')}</div>${history.length?`<button class="backbtn" id="back">← Back to the last choice</button>`:''}${glossLink()}</div>`;
    wireBack();
    if(sc.from && !(S.landing===1 && sc.day===1)) setTimeout(()=>SFX.ping(), 150);
    app.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
      const c = list[+btn.dataset.i]; SFX.tap(); setTimeout(()=>SFX.result(c.fx), 90);
      history.push(JSON.stringify({S, idx}));
      apply(c.fx||{}); Object.assign(S.f, c.set||{});
      last = {r:c.r, fx:c.fx||{}, picked:c.l}; phase='result'; render(); scrollTo(0,0);
    });
    return;
  }
  const picked = last.picked ? `<div class="when">You chose · ${last.picked}</div>` : '';
  const body = art(sc) + (last.auto ? `<div class="when">Day ${sc.day}</div>` : intro(sc,true)) + picked +
    `<div class="result">${last.r}</div><div class="chips">${chips(last.fx)}</div>
     <button class="primary" id="next">${nextIndex(idx+1)>=SCENES.length?'See how your 30 days went':'Continue'}</button>${history.length?`<button class="backbtn" id="back">← Change this choice</button>`:''}`;
  app.innerHTML = header(sc.day) + `<div class="scene fade">${body}</div>`;
  wireBack();
  document.getElementById('next').onclick = ()=>{
    SFX.tap(); idx = nextIndex(idx+1);
    phase = idx>=SCENES.length ? 'end' : 'scene';
    render(); scrollTo(0,0);
  };
}

function artKind(sc){
  if(sc.auto==='roof') return S.f.sibling==='sent' && ((S.v&&S.v.B)||0)===0 ? 'goat' : 'phone';
  if(sc.auto) return 'coins';
  if(sc.day===1) return 'plane';
  if(sc.day===17) return 'star';
  if(sc.from){
    const f = sc.from, c = C();
    if(/WhatsApp group/.test(f)) return 'group';
    if(/Student Finance/.test(f)) return 'school';
    if(/Town union|Class of/.test(f)) return 'hall';
    if(f===c.farmer) return 'farm';
    if(f===c.mum) return 'voice';
    if(f===c.sib) return ['house','card','pin','plane','car'][(S.v&&S.v.B)||0];
    if(f===c.friend || /colleague|boss/i.test(f)) return 'chat';
    return 'phone';
  }
  const t = sc.text||'';
  if(/snow|minus|winter|cold front|parka/i.test(t)) return 'snow';
  if(/rain/i.test(t)) return 'rain';
  if(/AC |electricity|heat/i.test(t)) return 'sun';
  if(/bank|card|credit/i.test(t)) return 'card';
  if(/craving|food|African shop/i.test(t)) return 'food';
  if(/tuition|lecture|library|student|study permit|campus/i.test(t)) return 'school';
  if(/car|bus|transit|road|licence|pavement|Uber/i.test(t)) return 'car';
  if(/laundry|dishes|house|room|basement/i.test(t)) return 'house';
  if(/job|interview|shift|induction|salary|employer|work/i.test(t)) return 'work';
  return 'globe';
}

/* ---------- What the scores mean ---------- */
const HEALTHY = 60;
// low below the first number, healthy from the second; home also has a ceiling
const MARKS = {peace:[35,60], home:[30,50], future:[25,40]};
const HOME_CAP = 85;
const healthy = (k, v) => v >= MARKS[k][1] && !(k==='home' && v > HOME_CAP);
function band(k, v){
  if(k==='cash'){
    const rent = RENT();
    if(v < 0) return {cls:'low', label:'In debt', meaning:'You owe more than you have. Generosity without a budget turned into debt.'};
    if(v < rent) return {cls:'low', label:'One bad week from trouble', meaning:"You have less than one month's rent saved."};
    if(v < rent*3) return {cls:'mid', label:'Breathing room', meaning:"You have one to three months' rent saved. Not rich, but not panicking."};
    return {cls:'high', label:'Proper safety net', meaning:"You have more than three months' rent saved. Abroad experts call this sleeping well."};
  }
  const T = {
    peace:[['Running on fumes','You are exhausted. Too many yeses, too little rest.'],['Holding it together','You are coping, but the stress is building.'],['Zen master','You protected your sanity and rested when you needed to.']],
    home:[['"You have changed"','Family relationships are strained. Expect long voice notes.'],['On speaking terms','Your family is okay with you, but they have opinions.'],['Well loved','Your family is happy with you, and you still kept something for yourself.']],
    future:[['Still loading','Little went into your career, savings, or plans. You survived, but you did not build.'],['Building slowly','You have started building something for yourself. Keep going.'],['On the up','Your choices are building a real future. Your later self says thank you.']]
  }[k];
  if(k==='home' && v > HOME_CAP) return {cls:'mid', label:'Family ATM risk', meaning:'Home is thrilled with you. Check what your savings and your peace paid for it.'};
  const i = v < MARKS[k][0] ? 0 : v < MARKS[k][1] ? 1 : 2;
  return {cls:['low','mid','high'][i], label:T[i][0], meaning:T[i][1]};
}
function lesson(){
  const rent = RENT();
  if(S.cash < 0) return "Your lesson: you gave more than you had. Generosity without a budget becomes debt, and debt follows you everywhere.";
  if(S.home > HOME_CAP && (S.cash < rent*3 || S.peace < MARKS.peace[1])) return "Your lesson: home is very happy with you, and your savings or your peace paid for it. You cannot give from an empty cup.";
  const m = [['peace',S.peace],['home',S.home],['future',S.future]].map(([k,v])=>[k, v - MARKS[k][1]]).sort((a,b)=>a[1]-b[1])[0];
  if(m[1] >= 0 && S.cash >= rent) return "Your lesson: you kept all four meters healthy at once. That is rare. Teach the rest of us.";
  return {
    peace:"Your lesson: saying yes to everything cost you your peace. A small no is still love.",
    home:"Your lesson: you protected yourself, but home feels far away. A phone call costs nothing.",
    future:"Your lesson: you gave so much to everyone else that your own future waited. Next time, protect one thing just for you."
  }[m[0]];
}

 ['Abeg','Please, in Pidgin. Usually before a request you should probably say no to.'],
 ['Ejo · Biko · Don Allah','Please, in Yoruba, Igbo, and Hausa.'],
 ['Ha! · Chineke! · Kai! · Ehn!','Exclamations of shock, from mild surprise to "I cannot believe what I am hearing".'],
 ['Omo! · Chai! · Wallahi','Wow, or "I swear". Pidgin, Igbo, and Hausa flavours of disbelief.'],
 ['E kaaro · Ututu oma · Ina kwana','Good morning, in Yoruba, Igbo, and Hausa.'],
 ['Omo mi · Nwa m','My child, in Yoruba and Igbo. What every mother calls you before a request.'],

function glossaryHTML(){ return `<dl class="gloss">${GLOSSARY.map(([w,m])=>`<dt>${w}</dt><dd>${m}</dd>`).join('')}</dl>`; }

    document.body.appendChild(o);
    o.addEventListener('click', e=>{ if(e.target===o) o.hidden=true; });
    o.querySelector('#glossclose').onclick = ()=>{ o.hidden=true; };
  }
  o.hidden = false; track('glossary');
}
function glossLink(){ return `<button class="glossbtn" type="button" onclick="openGlossary()">What do these Naija words mean?</button>`; }

function wireBack(){
  const b = document.getElementById('back');
  if(b) b.onclick = ()=>{
    const snap = JSON.parse(history.pop());

function intro(sc, compact){
  if(sc.from){
    return `<div class="when">Day ${sc.day} · New message</div>
      <div class="thread"><div class="who"><div class="avatar">${sc.from[0]}</div><div><b>${sc.from}</b><small>${sc.sub||''}</small></div></div>
      <div class="bubble">${sc.text}</div></div>`;
  }
  return `<div class="when">Day ${sc.day}</div>${compact?'':`<div class="narr">${sc.text}</div>`}`;

function verdict(){
  const f = S.f, low = A(300), mid = A(900);
  if(f.sibling==='sent' && S.home>=65 && S.cash<mid) return ["The Family ATM", `Everybody at home is thriving. You are eating Indomie in ${T()}.`];
  if(P()==='care' && S.f.cos==='reported') return ["Stronger Than The Agent","Somebody sold you a dream that did not exist. You reported it, found the real thing, and kept your head up."];
  if(P()==='scholar' && S.f.stipendHome && S.home>=60) return ["Scholar and Sponsor","You came on a scholarship and somehow became the family's scholarship too."];
  if((P()==='study' || P()==='partial') && (S.f.fees==='pending' || S.f.fees==='paused')) return ["Fees Still Pending","Student by day, worker by night, and negotiator with the finance office in between."];
  if((SOLD() || P()==='care' || P()==='visitor') && S.future>=30) return ["Making It By Force","There is no going back, so you are going forward. Slowly, stubbornly, and with your whole chest."];
  if(FUND()==='borrowed' && S.f.loan==='late') return ["Owing the Cooperative","You borrowed to japa, and the japa is now borrowing your peace. One repayment at a time."];
  if(S.cash<low) return ["Running on Prayers","You made it to day 30 on faith, leftover jollof, and a very patient bank."];
  if(S.peace<35) return ["Hustle Without Peace","The money is coming in. Your body has filed a formal complaint."];
  if(S.home<35) return ["Ghost Mode Activated","Your account is healthy. The family WhatsApp group thinks you have died."];
  if(S.landing>1 && S.future>=40) return ["Serial Japa Champion",`${S.landing} landings and still standing. You have started over more times than most people have moved house.`];
  if(S.future>=45) return ["Abroad Strategist","You protected your money, your peace, and your future. Your mates are taking notes."];
  return ["Still Finding Your Feet","Thirty days in, and you are still standing. That counts for more than people at home will ever know."];
}
function receipts(){
  const f = S.f, out = [], c = C(), vB = (S.v&&S.v.B)||0, vD = (S.v&&S.v.D)||0;
  if(f.sibling==='sent') out.push([`${c.sib} is still at roofing. The goat is doing well.`, `${c.sib}'s POS business is now a phone accessories stand.`, "You own one third of a plot that belongs to three people.", "You paid a japa agent who japa'd with your money.", "The Uber Corolla only drives to one address."][vB]);
  if(f.sibling==='checked') out.push(["You checked the building before paying.", "You checked the POS shop before paying.", "A lawyer saved you from buying a plot sold three times.", "You paid the exam centre directly. No agent got a kobo.", "A mechanic saved you from a 2004 Corolla with a 2020 face."][vB]);
  if(f.sibling==='video') out.push(["The roof photo had a watermark. You noticed.", "You asked for a business plan. The plan was to make money.", "The land documents said Original in three different fonts.", "The agent's signboard was not attached to anything.", "The car papers were a photo of a steering wheel."][vB]);
  if(f.car==='bought' && R.key==='us') out.push("Two years of ajo became a Corolla that coughs every morning.");
  if(f.farm==='sent') out.push(["300 birds died of cold in 31°C weather. You paid for it.", "You paid to restock fish that became pepper soup.", "You paid for a borehole the farm already had.", "You paid for vaccines for goats that were never sick.", "You paid to replace snails that never left."][vD]);
  if(f.farm==='counted') out.push([`412 birds alive and loud. ${c.farmer} is now very careful.`, "Your neighbour exposed the catfish pepper soup party.", "Your neighbour found the old borehole. It just needed a tap.", "Every goat present, healthy, and loud.", "Your neighbour confirmed that snails do not run."][vD]);
  if(f.cos==='reported') out.push("The care home address was a barbershop. You reported the agent.");
  if(f.cos==='cash') out.push("Cash in envelopes kept you fed and kept you afraid.");
  if(f.fees==='family') out.push("Somebody back home sold a plot so you could stay in school.");
  if(f.fees==='plan') out.push("You turned a scary deadline into three instalments.");
  if(f.stipendHome) out.push("Part of your stipend went home. Your fridge held three eggs and a lemon.");
  if(SOLD()) out.push("You sold everything to come. There was no plan B, so plan A had to work.");
  if(f.loan==='paid') out.push("You paid the cooperative on time. Your guarantor can sleep again.");
  if(f.loan==='late') out.push("The cooperative visited your mother. In front of the neighbours.");
  if(f.house==='managed') out.push("Your house back home now pays you instead of worrying you.");
  if(f.house==='brother') out.push("Your brother is guarding your house, with your good cups.");
  if(f.spouse==='looked') out.push(S.gender==='man' ? "Every Nigerian woman at the community meet-up was engaged or not ready for anything serious." : "Every Nigerian man at the community meet-up was married or focusing on himself.");
  if(f.network && R.key==='ca') out.push("A community event at minus 20 got you your first real job lead.");
  if(f.coat==='none') out.push("Naija blood was not enough for the cold.");
  return out.slice(0,4);
}

/* ---------- Result card picture ---------- */
function wrapText(ctx, text, maxW){
  const words = text.split(' '), lines = []; let line = '';
  for(const w of words){ const test = line ? line+' '+w : w; if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; }
  if(line) lines.push(line); return lines;
}
async function drawCard(title, line, journey, rec){
  try{ await Promise.all(["800 80px 'Playfair Display'","600 40px 'DM Sans'","800 40px 'DM Sans'"].map(f=>document.fonts.load(f))); }catch(e){}
  const W=1080, H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  const green='#102F28', gold='#E8BB69', paper='#F8F4E9';
  x.fillStyle=green; x.fillRect(0,0,W,H);
  x.beginPath(); x.arc(0,H*0.62,46,0,Math.PI*2); x.arc(W,H*0.62,46,0,Math.PI*2); x.fillStyle=paper; x.fill();
  x.setLineDash([18,14]); x.strokeStyle='rgba(255,255,255,.35)'; x.lineWidth=3; x.beginPath(); x.moveTo(70,H*0.62); x.lineTo(W-70,H*0.62); x.stroke(); x.setLineDash([]);
  x.fillStyle=gold; x.font="700 30px 'DM Sans', sans-serif"; x.fillText(S.daily ? `NOW YOU HAVE LANDED · TODAY'S LANDING ${dayLabel(S.daily).toUpperCase()}` : 'NOW YOU HAVE LANDED', 80, 110);
  x.fillStyle='rgba(255,255,255,.85)'; x.font="600 34px 'DM Sans', sans-serif";
  wrapText(x, journey, 900).slice(0,2).forEach((l,i)=>x.fillText(l, 80, 168+i*44));
  x.fillStyle=gold; x.font="700 28px 'DM Sans', sans-serif"; x.fillText('MY DAY 30 VERDICT', 80, 300);
  x.fillStyle='#FFFFFF'; x.font="800 88px 'Playfair Display', Georgia, serif";
  let y=400; wrapText(x, title, 920).slice(0,3).forEach(l=>{ x.fillText(l, 80, y); y+=100; });
  x.fillStyle='rgba(255,255,255,.92)'; x.font="600 40px 'DM Sans', sans-serif"; y+=10;
  wrapText(x, line, 920).slice(0,4).forEach(l=>{ x.fillText(l, 80, y); y+=54; });
  // journey route between the text and the divider
  const ry = Math.round((y + H*0.62) / 2) + 10, places = S.trail.map(t=>t.town).concat([L.town]);
  const xs = places.map((_,i)=> 120 + i*(840/Math.max(1,places.length-1)));
  x.setLineDash([10,10]); x.strokeStyle=gold; x.lineWidth=4; x.beginPath();
  for(let i=0;i<xs.length-1;i++){ const mx=(xs[i]+xs[i+1])/2; x.moveTo(xs[i],ry); x.quadraticCurveTo(mx, ry-90, xs[i+1], ry); }
  x.stroke(); x.setLineDash([]);
  xs.forEach((px,i)=>{ x.beginPath(); x.arc(px,ry,12,0,Math.PI*2); x.fillStyle = i===xs.length-1 ? gold : '#FFFFFF'; x.fill();
    x.fillStyle='rgba(255,255,255,.85)'; x.font="700 24px 'DM Sans', sans-serif"; const lab=places[i].toUpperCase().slice(0,14); const w=x.measureText(lab).width;
    x.fillText(lab, Math.min(W-60-w, Math.max(60, px-w/2)), ry+48); });
  const pmx=(xs[xs.length-2]+xs[xs.length-1])/2; x.save(); x.translate(pmx, ry-68); x.rotate(0.12); x.fillStyle='#FFFFFF';
  x.beginPath(); x.moveTo(-34,0); x.lineTo(26,-4); x.quadraticCurveTo(36,-4,36,0); x.quadraticCurveTo(36,4,26,4); x.lineTo(-34,2); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(-2,-2); x.lineTo(-14,-22); x.lineTo(-6,-22); x.lineTo(12,-2); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(-2,3); x.lineTo(-14,22); x.lineTo(-6,22); x.lineTo(12,3); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(-30,0); x.lineTo(-38,-12); x.lineTo(-32,-12); x.lineTo(-24,0); x.closePath(); x.fill(); x.restore();
  const stats=[['CASH','cash',money(S.cash),''],['PEACE','peace',String(S.peace),'/100'],['HOME','home',String(S.home),'/100'],['FUTURE','future',String(S.future),'/100']];
  stats.forEach(([k,key,v,suf],i)=>{ const bx=80+i*235, by=H*0.62+50, b=band(key,S[key]);
    x.fillStyle='rgba(255,255,255,.1)'; x.fillRect(bx,by,215,170);
    x.fillStyle=gold; x.font="700 24px 'DM Sans', sans-serif"; x.fillText(k, bx+20, by+42);
    x.fillStyle='#FFFFFF'; x.font=`700 ${v.length>6?34:44}px 'DM Sans', sans-serif`; x.fillText(v, bx+20, by+98);
    if(suf){ const w=x.measureText(v).width; x.fillStyle='rgba(255,255,255,.6)'; x.font="700 24px 'DM Sans', sans-serif"; x.fillText(suf, bx+24+w, by+98); }
    x.fillStyle = b.cls==='high' ? '#9BE3B8' : b.cls==='mid' ? gold : '#F2A08F'; x.font="700 21px 'DM Sans', sans-serif";
    wrapText(x, b.label.replace(/"/g,''), 180).slice(0,2).forEach((l,j)=>x.fillText(l, bx+20, by+132+j*24)); });
  x.fillStyle='rgba(255,255,255,.85)'; x.font="600 30px 'DM Sans', sans-serif"; y=H*0.62+275;
  rec.slice(0,2).forEach(r=>{ wrapText(x, '› '+r, 920).slice(0,1).forEach(l=>{ x.fillText(l, 80, y); y+=42; }); });
  x.fillStyle=gold; x.font="800 38px 'Playfair Display', Georgia, serif"; x.fillText("What's your verdict?", 80, H-90);
  x.fillStyle='#FFFFFF'; x.font="600 32px 'DM Sans', sans-serif"; x.fillText('Play free at nowyouhavelanded.com', 80, H-44);
  return cv;
}

/* ---------- Verdict collection ---------- */
const VERDICTS = [
 ['Abroad Strategist','Protect your money, your peace, and your future at the same time.'],
 ['The Family ATM','Send the big money home and keep your family very, very happy.'],
 ['Running on Prayers','Finish the month with almost nothing left.'],
 ['Hustle Without Peace','Chase the money until your peace runs out.'],
 ['Ghost Mode Activated','Ignore home until the family group forgets you.'],
 ['Still Finding Your Feet','Finish somewhere comfortably in the middle.'],
 ['Serial Japa Champion','Japa again from the result screen and keep building.'],
 ['Making It By Force','Sell everything to come, then build your future anyway.'],
 ['Scholar and Sponsor','Go on a full scholarship and send your stipend home.'],
 ['Fees Still Pending','Go as a student and leave your fees unpaid.'],
 ['Owing the Cooperative','Borrow money for the move and ignore the repayment.'],
 ['Stronger Than The Agent','Take the UK care visa route and report the fake agent.']
];
function loadVerdicts(){ try{ return JSON.parse(localStorage.getItem('nyhl-verdicts')||'[]'); }catch(e){ return []; } }
function saveVerdict(t){ const v = loadVerdicts(); const isNew = !v.includes(t); if(isNew){ v.push(t); try{ localStorage.setItem('nyhl-verdicts', JSON.stringify(v)); }catch(e){} } return isNew; }
function collectionHTML(current, isNew){
  const got = loadVerdicts();
  return `<div class="collection">
    <div class="coll-head"><div class="when">Your verdict collection</div><b>${got.length} of ${VERDICTS.length} unlocked</b></div>
    <div class="coll-bar"><i style="width:${Math.round(got.length/VERDICTS.length*100)}%"></i></div>
    <div class="coll-grid">${VERDICTS.map(([t,h])=>{ const has=got.includes(t), cur=t===current;
      return `<div class="vbadge ${has?'got':'locked'}${cur?' cur':''}"><b>${has ? t : '? ? ?'}</b>${cur && isNew ? '<span class="newtag">New!</span>' : ''}<small>${has ? (cur ? 'Just unlocked this game' : 'Unlocked') : 'Hint: '+h}</small></div>`; }).join('')}</div>
  </div>`;
}

function renderEnd(app){
  const [title, line] = verdict(), rec = receipts();
  track('finish-'+title.toLowerCase().replace(/[^a-z]+/g,'-'));
  const isNewVerdict = saveVerdict(title);
  setTimeout(()=>SFX.verdict(S.cash > 0 && (S.peace + S.home + S.future) / 3 >= 50), 250);
  const where = `${L.town}, ${R.country}`;
  const journey = S.trail.map(t=>t.town).concat([L.town]).join(' → ');
  const share = `${S.daily ? `Today's Landing, ${dayLabel(S.daily)}. ` : ''}I played Now You Have Landed (${journey}) and I am "${title}". ${line} Finished 30 days with ${money(S.cash)}, Peace ${S.peace}, Home ${S.home}, Future ${S.future}. Wetin be your own?`;
  app.innerHTML = `<div class="scene fade">
    <div class="when">Day 30 · Your result${S.daily ? ` · Today's Landing, ${dayLabel(S.daily)}` : ''}</div>
    <div class="journey-line">${journey}</div>
    <div class="verdict">
      <div class="label">Now You Have Landed</div>
      <h2>${title}</h2>
      <p>${line}</p>
      ${rec.length?`<div class="receipts">${rec.map(r=>`<div>${r}</div>`).join('')}</div>`:''}
    </div>
    <div class="sheet">
      <div class="when">What your choices did</div>
      ${[['cash','Cash',money(S.cash)],['peace','Peace',S.peace+'/100'],['home','Home',S.home+'/100'],['future','Future',S.future+'/100']].map(([k,n,v])=>{ const b=band(k, S[k]); return `
      <div class="meter ${b.cls}">
        <div class="meter-top"><b>${n}</b><span class="val">${v}</span><span class="tag">${b.label}</span></div>
        ${k==='cash' ? '' : `<div class="mbar"><i style="width:${S[k]}%"></i><em style="left:${MARKS[k][1]}%" title="Healthy from ${MARKS[k][1]}"></em>${k==='home'?`<em class="cap" style="left:${HOME_CAP}%" title="Above ${HOME_CAP} means you may be overgiving"></em>`:''}</div>`}
        <p>${b.meaning}</p>
      </div>`; }).join('')}
      <p class="bench">Healthy marks: Peace ${MARKS.peace[1]}, Future ${MARKS.future[1]} (you started at 20), and Home between ${MARKS.home[1]} and ${HOME_CAP}. Above ${HOME_CAP}, home may be loving you at your own expense. For cash, healthy is three months' rent saved.</p>
      <div class="lesson">${lesson()}</div>
    </div>
    ${collectionHTML(title, isNewVerdict)}
    <div class="cardwrap"><img id="cardimg" alt="Your result card" hidden></div>
    <button class="primary" id="sharecard">Share my result card</button>
    <div class="share">
      <div class="when">Or share as text</div>
      <div class="share-row">
        <a class="sbtn wa" id="s-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="sbtn" id="s-x" target="_blank" rel="noopener">X</a>
        <a class="sbtn" id="s-li" target="_blank" rel="noopener">LinkedIn</a>
        <button class="sbtn" id="copy">Copy</button>
      </div>
    </div>
    <div class="row">
      <button class="ghost" id="move">Japa again to another country</button>
      <button class="ghost" id="pada">${S.f.pada ? 'Japada. Go back home' : 'Japada. What if you went back home?'}</button>
      <button class="ghost" id="again">Start a new life</button>
    </div>
    <div id="movebox" hidden class="routes"></div>
    <div id="padabox" hidden class="result padabox"></div>
    <a class="storylink" href="https://tally.so/r/q5480d" target="_blank" rel="noopener">Have a japa story? Share it and it could become a scene in the game →</a>
    <div class="toast" id="toast" role="status"></div>
    <div class="foot">Everybody wants to japa. Nobody tells you what happens after you land.</div>
    <div class="foot small">A fictional game. Costs and situations are illustrative, not immigration or financial advice.</div>
  </div>`;
  document.getElementById('pada').onclick = ()=>{
    track('japada'); SFX.land();
    const box = document.getElementById('padabox'), c = C(), rent = RENT();
    const lines = [`You land back in ${O()} after ${S.landing>1 ? 'more than one japa' : 'thirty days abroad'}.`];
    lines.push(S.cash >= rent*3 ? `You come home with ${money(S.cash)} saved, which is more than most people expected.` : S.cash >= 0 ? `You come home with ${money(S.cash)} and a lot of stories.` : `You come home owing ${money(-S.cash)}, and the first person to ask "where is our own?" gets a very long silence.`);
    lines.push(S.home >= 50 ? `${c.mum} cooks ${c.food} and tells everyone you are "on holiday".` : `Half the family is happy to see you. The other half wants to know what happened.`);
    lines.push(S.future >= 40 ? "You bring back skills, contacts, and a clearer head. This time you know exactly what you want." : "You sleep through the night for the first time in a month. The plan can wait until you are rested.");
    lines.push("Japada is not failure. Sometimes the plan changes, and coming home is the bravest part.");
    box.innerHTML = `<div class="when">Japada · Back in ${O()}</div>${lines.map(l=>`<p>${l}</p>`).join('')}`;
    box.hidden = false; box.scrollIntoView({behavior:'smooth', block:'nearest'});
  };
  document.getElementById('again').onclick = ()=>{ fresh(); pick.route=null; pick.qroute=null; pick.daily=false; pick.duo=0; render(); scrollTo(0,0); };
  const SITE = 'https://nowyouhavelanded.com';
  let cardFile = null, cardBlob = null;
  drawCard(title, line, journey, rec).then(canvas => {
    const img = document.getElementById('cardimg'); if(!img) return;
    img.src = canvas.toDataURL('image/png'); img.hidden = false;
    canvas.toBlob(b => { cardBlob = b; try{ cardFile = new File([b], 'my-landed-verdict.png', {type:'image/png'}); }catch(e){} }, 'image/png');
  });
  document.getElementById('sharecard').onclick = () => {
    track('share-card');
    const t = document.getElementById('toast');
    if(!cardBlob){ t.textContent = "Your card is still being made. Try again in a second."; return; }
    if(cardFile && navigator.canShare && navigator.canShare({files:[cardFile]})){
      navigator.share({files:[cardFile], text:`${S.daily ? `Today's Landing, ${dayLabel(S.daily)}. ` : ''}My verdict: ${title}. What is yours? ${SITE}`}).catch(()=>{});
      return;
    }
    try{
      const a = document.createElement('a'); a.href = URL.createObjectURL(cardBlob); a.download = 'my-landed-verdict.png';
      document.body.appendChild(a); a.click(); a.remove();
      t.textContent = "Card saved. Post it on your WhatsApp status, LinkedIn, or Instagram.";
    }catch(e){ t.textContent = "Press and hold the card above to save it."; }
  };
  const text = share + ' Play here: ' + SITE;
  const enc = encodeURIComponent;
  document.getElementById('s-wa').href = 'https://wa.me/?text=' + enc(text);
  document.getElementById('s-x').href = 'https://twitter.com/intent/tweet?text=' + enc(share) + '&url=' + enc(SITE);
  document.getElementById('s-li').href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + enc(SITE);
  ['s-wa','s-x','s-li'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('click',()=>track('share-'+id.slice(2))); });
  const sl=document.querySelector('.storylink'); if(sl) sl.addEventListener('click',()=>track('story-form'));
  document.getElementById('copy').onclick = ()=>{
    track('share-copy');
    const t = document.getElementById('toast');
    const fallback = ()=>{ t.textContent = text; t.style.userSelect = 'all'; };
    try{ navigator.clipboard.writeText(text).then(()=>{ t.textContent = "Copied. Paste it anywhere, including LinkedIn."; }).catch(fallback); }catch(e){ fallback(); }
  };
  document.getElementById('move').onclick = ()=>{
    const box = document.getElementById('movebox'); box.hidden = false;
    box.innerHTML = `<div class="when">Where are you moving next?</div>` +
      Object.values(ROUTES).filter(r=>r.key!==R.key).map(r=>`<button class="route-btn" data-r="${r.key}"><b>${r.label}</b><span>${r.sub}</span></button>`).join('');
    box.querySelectorAll('.route-btn').forEach(btn=>btn.onclick=()=>{
      const rk = btn.dataset.r;
      box.innerHTML = `<label class="when" for="place2">${ROUTES[rk].ask}</label><select id="place2" class="select">${placeOptions(rk)}</select><button class="primary" id="go2">Land in ${ROUTES[rk].label}</button>`;
      document.getElementById('go2').onclick = ()=>{
        const prev = {origin:S.origin, trail:S.trail, peace:S.peace, home:S.home, future:S.future, landing:S.landing, culture:S.culture, sold:S.sold, fund:S.fund, gender:S.gender, daily:S.daily, duo:S.duo, duoDay:S.duoDay};
        const pl = document.getElementById('place2').value;
        SFX.land(); begin(rk, pl, prev); render(); scrollTo(0,0);
      };
    });
  };
}

function start(data){
  fresh();
  if(data && data.rk && data.pn){ R = ROUTES[data.rk]; L = places(data.rk).find(p=>p.name===data.pn); S = data.S; idx = data.idx; phase = data.phase; last = data.last; history = data.history||[]; }
  render();
}
window.claude?.hot?.snapshot?.(()=>({rk:R&&R.key, pn:L&&L.name, S, idx, phase, last, history}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
