<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Everybody wants to japa. Nobody tells you what happens after you land. A free 30-day game about your first month abroad.">
<meta property="og:title" content="Now You Have Landed">
<meta property="og:description" content="Everybody wants to japa. Nobody tells you what happens after you land. Play free in your browser.">
<meta property="og:url" content="https://nowyouhavelanded.com">

<title>Now You Have Landed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one phone-width column styled like a boarding pass and a WhatsApp thread, passport green and stamp gold */
:root{
  --paper:#F2F5F0; --card:#FFFFFF; --ink:#10231A; --muted:#5B6D63; --line:#D5DDD6;
  --green:#0E5A3A; --green-ink:#FFFFFF; --gold:#B8901A; --bubble:#E3F1E7;
  --good:#1F7A4A; --bad:#B3412E;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1611; --card:#12211A; --ink:#E7EFE9; --muted:#8FA398; --line:#233429;
  --green:#2E9A68; --green-ink:#06130D; --gold:#E0BD4C; --bubble:#173326;
  --good:#4CC385; --bad:#E77A64; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1611; --card:#12211A; --ink:#E7EFE9; --muted:#8FA398; --line:#233429;
  --green:#2E9A68; --green-ink:#06130D; --gold:#E0BD4C; --bubble:#173326;
  --good:#4CC385; --bad:#E77A64; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Pass header */
.pass{background:var(--green);color:var(--green-ink);border-radius:14px;padding:14px 16px;display:grid;gap:10px;position:relative;overflow:hidden}
.pass::after{content:"";position:absolute;right:-18px;top:50%;width:36px;height:36px;border-radius:50%;background:var(--paper);transform:translateY(-50%)}
.pass-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-right:22px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em}
.day{font-family:var(--mono);font-size:13px;letter-spacing:.08em;opacity:.9}
.route{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-right:22px}
.stat{display:grid;gap:3px;min-width:0}
.stat b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--green-ink) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s ease}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .5s ease}

/* Scene */
.scene{display:grid;gap:14px}
.when{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.narr{font-size:18px;line-height:1.55;text-wrap:pretty}
.thread{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:800}
.who b{font-weight:700}
.who small{display:block;color:var(--muted);font-size:12px}
.bubble{background:var(--bubble);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:16px;max-width:92%}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:600;font-size:16px;display:flex;gap:12px;align-items:center;transition:border-color .15s,transform .1s}
.choice:hover{border-color:var(--green)}
.choice:active{transform:scale(.99)}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:700;flex:none}
.result{background:var(--card);border-left:3px solid var(--gold);border-radius:4px 12px 12px 4px;padding:12px 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.primary{background:var(--green);color:var(--green-ink);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;width:100%}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:13px 18px;font-weight:600;width:100%}

/* Intro */
.intro{display:grid;gap:18px;padding-top:8px}
.stamp{justify-self:start;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:1.5px solid var(--gold);padding:4px 10px;border-radius:4px;transform:rotate(-3deg)}
.intro h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,11vw,54px);line-height:.95;letter-spacing:-.01em;margin:0;text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--green);display:block;font-size:.5em;letter-spacing:.02em;margin-top:8px}
.intro p{margin:0;font-size:17px;color:var(--muted);max-width:38ch}
.kit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kit div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
.kit b{font-family:var(--mono);font-size:15px}
.kit span{font-size:12px;color:var(--muted)}

/* Ending */
.verdict{background:var(--green);color:var(--green-ink);border-radius:16px;padding:20px 18px;display:grid;gap:12px}
.verdict .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.verdict h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.verdict p{margin:0;font-size:17px}
.receipts{display:grid;gap:6px;border-top:1px dashed color-mix(in srgb,var(--green-ink) 40%,transparent);padding-top:12px;font-size:15px}
.receipts div::before{content:"› ";color:var(--gold);font-weight:700}
.final{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-family:var(--mono);font-size:13px}
.final div{display:grid;gap:2px}
.final span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{font-size:14px;color:var(--good);min-height:20px;text-align:center}
.routes{display:grid;gap:10px}
.route-btn{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:2px}
.route-btn:hover{border-color:var(--green)}
.route-btn b{font-family:var(--display);font-size:17px;color:var(--green)}
.route-btn span{font-size:14px;color:var(--muted)}
.route-btn.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.local{background:var(--bubble);border-radius:12px;padding:10px 12px;font-size:15px;display:grid;gap:2px}
.local b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.journey-line{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700}
.foot.small{font-size:11px;opacity:.85}
.backbtn{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:6px 0;text-align:left}
.backbtn:hover{color:var(--green)}
.share{display:grid;gap:8px}
.share-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sbtn{display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:700;font-size:14px;cursor:pointer;min-width:0}
.sbtn:hover{border-color:var(--green)}
.sbtn.wa{background:var(--green);color:var(--green-ink);border-color:var(--green)}
@media (max-width:360px){.share-row{grid-template-columns:repeat(2,1fr)}}
.foot{font-size:13px;color:var(--muted);text-align:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i,.progress i{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Places ---------- */
// [name, costTier 1-3, coldTier 0-2, needsCar 1/0, town, note]
const US_PLACES = [
 ["Alabama",1,0,1],["Alaska",3,2,1],["Arizona",2,0,1],["Arkansas",1,0,1],
 ["California",3,0,1,"","California rent will humble you before your first job does."],
 ["Colorado",2,1,1],["Connecticut",3,2,1],["Delaware",2,1,1],
 ["District of Columbia",3,1,0,"Washington","DC is full of policy people. Your Nigerian experience finally makes sense to somebody."],
 ["Florida",2,0,1,"","Florida is warm like home. The hurricanes are not."],
 ["Georgia",2,0,1,"","Atlanta's Nigerian churches have better sound systems than most concerts."],
 ["Hawaii",3,0,1],["Idaho",1,2,1],
 ["Illinois",2,2,1,"","Chicago wind has strong opinions about your choices."],
 ["Indiana",1,2,1],["Iowa",1,2,1],["Kansas",1,1,1],["Kentucky",1,1,1],["Louisiana",1,0,1],["Maine",2,2,1],
 ["Maryland",3,1,1,"","Half the Nigerians you know already live here. The aunties will find you before your mail does."],
 ["Massachusetts",3,2,1,"","Boston has many universities and many very cold mornings."],
 ["Michigan",2,2,1],
 ["Minnesota",2,2,1,"","Minnesota cold is not weather. It is a personality test."],
 ["Mississippi",1,0,1],["Missouri",1,1,1],["Montana",1,2,1],["Nebraska",1,2,1],
 ["Nevada",2,0,1,"","In Nevada the desert heat is free and everything else costs money."],
 ["New Hampshire",2,2,1],
 ["New Jersey",3,1,1,"","Close enough to New York to pay New York prices."],
 ["New Mexico",1,1,1],
 ["New York",3,2,0,"","Nobody needs a car here. Everybody needs patience on the subway."],
 ["North Carolina",2,1,1],["North Dakota",1,2,1],["Ohio",1,2,1],["Oklahoma",1,1,1],["Oregon",2,1,1],
 ["Pennsylvania",2,2,1],["Rhode Island",2,2,1],["South Carolina",2,0,1],["South Dakota",1,2,1],["Tennessee",1,1,1],
 ["Texas",2,0,1,"","Houston has so many Nigerians that you will hear Yoruba at the grocery store before you hear English."],
 ["Utah",2,1,1],["Vermont",2,2,1],["Virginia",2,1,1],["Washington",3,1,1],["West Virginia",1,1,1],["Wisconsin",1,2,1],["Wyoming",1,2,1]
];
const UK_GROUPS = {
 "England":["Bedfordshire","Berkshire","Bristol","Buckinghamshire","Cambridgeshire","Cheshire","City of London","Cornwall","Cumbria","Derbyshire","Devon","Dorset","Durham","East Riding of Yorkshire","East Sussex","Essex","Gloucestershire","Greater London","Greater Manchester","Hampshire","Herefordshire","Hertfordshire","Isle of Wight","Kent","Lancashire","Leicestershire","Lincolnshire","Merseyside","Norfolk","North Yorkshire","Northamptonshire","Northumberland","Nottinghamshire","Oxfordshire","Rutland","Shropshire","Somerset","South Yorkshire","Staffordshire","Suffolk","Surrey","Tyne and Wear","Warwickshire","West Midlands","West Sussex","West Yorkshire","Wiltshire","Worcestershire"],
 "Scotland":["Aberdeen City","Aberdeenshire","Angus","Argyll and Bute","City of Edinburgh","Clackmannanshire","Dumfries and Galloway","Dundee City","East Ayrshire","East Dunbartonshire","East Lothian","East Renfrewshire","Falkirk","Fife","Glasgow City","Highland","Inverclyde","Midlothian","Moray","Na h-Eileanan Siar","North Ayrshire","North Lanarkshire","Orkney Islands","Perth and Kinross","Renfrewshire","Scottish Borders","Shetland Islands","South Ayrshire","South Lanarkshire","Stirling","West Dunbartonshire","West Lothian"],
 "Wales":["Clwyd","Dyfed","Gwent","Gwynedd","Mid Glamorgan","Powys","South Glamorgan","West Glamorgan"],
 "Northern Ireland":["Antrim","Armagh","Down","Fermanagh","Londonderry","Tyrone"]
};
const UK_COST3 = ["Greater London","City of London","Surrey","Berkshire","Oxfordshire","Hertfordshire","Buckinghamshire","Cambridgeshire","City of Edinburgh"];
const UK_COST1 = ["Durham","Tyne and Wear","Northumberland","Cumbria","Lincolnshire","Na h-Eileanan Siar","Orkney Islands","Shetland Islands","Dumfries and Galloway","Antrim","Armagh","Down","Fermanagh","Londonderry","Tyrone","Dyfed","Powys","Gwynedd","Mid Glamorgan"];
const UK_TOWN = {"Greater London":"London","City of London":"London","Greater Manchester":"Manchester","West Midlands":"Birmingham","Norfolk":"Norwich","West Yorkshire":"Leeds","South Yorkshire":"Sheffield","Merseyside":"Liverpool","Tyne and Wear":"Newcastle","City of Edinburgh":"Edinburgh","Glasgow City":"Glasgow","South Glamorgan":"Cardiff","Antrim":"Belfast","Bristol":"Bristol","Leicestershire":"Leicester","Nottinghamshire":"Nottingham","Aberdeen City":"Aberdeen","Dundee City":"Dundee"};
const UK_NOTE = {
 "Greater London":"London rent costs a pound per breath, and the Nigerian parties never end.",
 "Greater Manchester":"Manchester rain is not weather. It is a lifestyle.",
 "West Midlands":"Birmingham has jollof, Nigerian churches, and a bus network you will learn the hard way.",
 "Essex":"Essex has a Nigerian Sunday-service economy of its own.",
 "Kent":"Kent is close enough to London for the prices and far enough for the train fares.",
 "Norfolk":"Norwich is quiet, green, and very far from any jollof.",
 "West Yorkshire":"Leeds is friendly, rainy, and full of students who all seem to be named Josh.",
 "City of Edinburgh":"Edinburgh is beautiful, hilly, and windy enough to remove your gele.",
 "Glasgow City":"Glasgow is warm in spirit and nothing else.",
 "South Glamorgan":"Cardiff is calm and kind, and every road sign is in two languages.",
 "Antrim":"Belfast is small, friendly, and you will meet the same three Nigerians everywhere."
};
const CA_PLACES = [
 ["Alberta",2,2,1,"Calgary","Calgary has a Nigerian community big enough to throw an owambe at minus 30."],
 ["British Columbia",3,1,0,"Vancouver","Vancouver rain will remind you of the UK. The rent will remind you of nothing you can afford."],
 ["Manitoba",1,2,1,"Winnipeg","Winnipeg cold makes Maryland look like Lagos."],
 ["New Brunswick",1,2,1],["Newfoundland and Labrador",1,2,1],["Northwest Territories",2,2,1],
 ["Nova Scotia",2,2,1,"Halifax","Halifax is friendly, coastal, and windy enough to steal your cap."],
 ["Nunavut",3,2,1,"","Groceries in Nunavut cost more than your flight."],
 ["Ontario",3,2,0,"Toronto","Toronto and Brampton rents will make you miss your duplex back home."],
 ["Prince Edward Island",1,2,1],
 ["Quebec",2,2,0,"Montreal","Your French stops at bonjour, which gets you exactly one sentence into every conversation."],
 ["Saskatchewan",1,2,1],["Yukon",2,2,1]
];
function placeFrom(arr){ const [name,cost,cold,car,town,note] = arr; return {name, cost, cold, car:!!car, town: town||name, note: note||''}; }
function places(key){
  if(key==='us') return US_PLACES.map(placeFrom);
  if(key==='ca') return CA_PLACES.map(placeFrom);
  const out = [];
  for(const g in UK_GROUPS) for(const n of UK_GROUPS[g]){
    const cost = UK_COST3.includes(n)?3:UK_COST1.includes(n)?1:2;
    out.push({name:n, group:g, cost, cold:1, car:false, town:UK_TOWN[n]||n, note:UK_NOTE[n]||''});
  }
  return out;
}

const ROUTES = {
  us:{key:'us', country:'USA', cur:'$', k:1, start:5000, rent:700, label:'United States', ask:'Which state?', sub:'Cars, credit scores, and "US experience"', def:'Maryland'},
  uk:{key:'uk', country:'UK', cur:'£', k:0.8, start:2500, rent:520, label:'United Kingdom', ask:'Which county?', sub:'Rain, tiny houses, and cars from the wrong side', def:'Norfolk'},
  ca:{key:'ca', country:'Canada', cur:'C$', k:1.35, start:4000, rent:1100, label:'Canada', ask:'Which province or territory?', sub:'Basement apartments and minus 30', def:'Ontario'}
};

const ORIGIN_LIST = [["Abia","Aba"],["Adamawa","Yola","YOL"],["Akwa Ibom","Uyo","QUO"],["Anambra","Onitsha"],["Bauchi","Bauchi","BCU"],["Bayelsa","Yenagoa"],["Benue","Makurdi","MDI"],["Borno","Maiduguri","MIU"],["Cross River","Calabar","CBQ"],["Delta","Asaba","ABB"],["Ebonyi","Abakaliki"],["Edo","Benin City","BNI"],["Ekiti","Ado-Ekiti"],["Enugu","Enugu","ENU"],["FCT","Abuja","ABV"],["Gombe","Gombe","GMO"],["Imo","Owerri","QOW"],["Jigawa","Dutse"],["Kaduna","Kaduna","KAD"],["Kano","Kano","KAN"],["Katsina","Katsina","DKA"],["Kebbi","Birnin Kebbi"],["Kogi","Lokoja"],["Kwara","Ilorin","ILR"],["Lagos","Lagos","LOS"],["Nasarawa","Lafia"],["Niger","Minna","MXJ"],["Ogun","Abeokuta"],["Ondo","Akure","AKR"],["Osun","Osogbo"],["Oyo","Ibadan","IBA"],["Plateau","Jos","JOS"],["Rivers","Port Harcourt","PHC"],["Sokoto","Sokoto","SKO"],["Taraba","Jalingo"],["Yobe","Damaturu"],["Zamfara","Gusau"]];
const ORIGINS = Object.fromEntries(ORIGIN_LIST.map(([st,city,code])=>[city, code || city.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()]));
let R, L, S, idx, phase, last, history = [], pick = {route:null, place:null, origin:"Abuja", culture:"general"};
const O = () => S.origin;
const MULT = [0, .75, 1, 1.35];
const A = x => Math.round(x*R.k/5)*5;                 // shared amounts, converted to local currency
const RENT = () => Math.round(R.rent*MULT[L.cost]/10)*10;
const M = x => R.cur + Math.abs(Math.round(x)).toLocaleString('en-GB');
const T = () => L.town;

function fresh(){ R=null; L=null; S=null; idx=0; phase='intro'; last=null; }
function begin(rk, pname, prev){
  const origin = prev ? prev.origin : pick.origin;
  const trail = prev ? prev.trail.concat([{code:L.town.slice(0,3).toUpperCase(), town:L.town, country:R.country}]) : [{code:ORIGINS[origin]||'NGA', town:origin, country:'Nigeria'}];
  R = ROUTES[rk]; L = places(rk).find(p=>p.name===pname);
  // trail now holds every place before this landing
  const culture = prev ? prev.culture : pick.culture;
  S = prev ? {cash:R.start, peace:prev.peace, home:prev.home, future:prev.future, f:{}, origin, trail, landing:prev.landing+1, culture}
           : {cash:R.start, peace:70, home:60, future:20, f:{}, origin, trail, landing:1, culture};
  history = [];
  idx = nextIndex(0); phase = 'scene';
}
function localNote(){
  if(L.note) return L.note;
  const bits = [];
  if(L.cost===3) bits.push("Rent here will humble you.");
  else if(L.cost===1) bits.push("Rent is kinder here than in the big cities.");
  if(L.cold===2) bits.push("The winters are serious.");
  if(L.cold===0) bits.push("The weather is closer to home.");
  if(L.car) bits.push("You will need a car."); else bits.push("You can survive without a car.");
  return bits.join(' ');
}

/* ---------- Culture and state of origin ---------- */
const STATE_CULTURE = {Lagos:'yoruba',Ogun:'yoruba',Oyo:'yoruba',Osun:'yoruba',Ondo:'yoruba',Ekiti:'yoruba',Kwara:'yoruba',
  Abia:'igbo',Anambra:'igbo',Ebonyi:'igbo',Enugu:'igbo',Imo:'igbo',
  Kano:'hausa',Kaduna:'hausa',Katsina:'hausa',Jigawa:'hausa',Zamfara:'hausa',Sokoto:'hausa',Kebbi:'hausa',Bauchi:'hausa',Gombe:'hausa'};
const CULTURES = {
  yoruba:{label:'Yoruba', mum:'Mummy', endear:'omo mi', sib:'Tunde', aunty:'Aunty Folake', cousin:'Bisi', farmer:'Mr. Adewale', friend:'Seun', party:'owambe', food:'amala and ewedu',
          bless:'"Olorun a bukun e," she says. God will bless you.'},
  igbo:{label:'Igbo', mum:'Mama', endear:'nwa m', sib:'Chidi', aunty:'Aunty Ngozi', cousin:'Adaeze', farmer:'Mr. Emeka', friend:'Obinna', party:'Christmas in the village', food:'ofe onugbu',
          bless:'"Chukwu gozie gi," she says. God bless you.'},
  hausa:{label:'Hausa', mum:'Umma', endear:'my child', sib:'Abubakar', aunty:'Hajiya Aisha', cousin:'Zainab', farmer:'Malam Sani', friend:'Usman', party:'Sallah', food:'tuwo and miyan kuka',
          bless:'"Allah ya saka da alheri," she says. May God reward you with good.'},
  general:{label:'General Nigerian', mum:'Mummy', endear:'my child', sib:'Daniel', aunty:'Aunty Grace', cousin:'Blessing', farmer:'Mr. Peter', friend:'Victor', party:'Christmas back home', food:'jollof',
          bless:'"God bless you, my child," she says.'}
};
const C = () => Object.assign({}, CULTURES[S.culture||'general'], {home: S.origin});
const pickV = (key, n) => { S.v = S.v || {}; if(S.v[key]===undefined) S.v[key] = Math.floor(Math.random()*n); return S.v[key]; };

/* ---------- Shared scenes (each has several versions, picked at random per game) ---------- */
const mummyThanks = () => { const c = C(); return [
 {day:3, from:c.mum, sub:`${c.home} · 11:42pm`, text:`Thank God you landed safely, ${c.endear}. The family is doing a small celebration for your safe arrival. Your uncle said you should send something. Everybody will be there.`,
  choices:[

  choices:[

   {l:`Cheap motel for now, ${M(Math.round(560*MULT[L.cost]))}`, fx:{cash:-Math.round(560*MULT[L.cost]), peace:-5}, set:{stay:'motel'}, r:"Two weeks at a motel off the highway. The heater rattles like a danfo, and you are paying money just to think."}]},

     {l:"Uber everywhere until you decide", fx:{cash:-320, peace:2}, set:{car:'uber'}, r:"Three hundred and twenty dollars later, the drivers know you by name."}]}
 : {day:5, text:`In ${T()} a car is more trouble than help. Parking alone costs more than your first rent in ${O()}.`,

     {l:"Walk everywhere and save money", fx:{peace:-6, future:2}, r:"Your legs are strong. Your shoes are finished."},

   {l:"Get your degrees evaluated and hold out", fx:{cash:-200, future:12, peace:-4}, set:{job:'field'}, r:"A credential evaluation costs $200 and says your master's equals a US master's. Employers still want US experience."}]},

let SCENES = [];
function scenes(){ return R.key==='us' ? US() : R.key==='uk' ? UK() : CA(); }

function autoEvent(kind){
  const f = S.f, k = R.key; let text = '', fx = {};
  if(kind==='pay1'){
    if(k==='us'){
      if(f.job==='warehouse'){ text = "First paycheck. $1,100 after tax. You stare at the tax line for a long time."; fx = {cash:1100, peace:-3}; }
      else if(f.job==='care'){ text = "First paycheck. $900. Aunty asks how much you got before you have even opened the app."; fx = {cash:900}; }
      else { text = "No paycheck. Your savings are now your salary, and they are not getting a raise."; fx = {cash:0, peace:-5}; }
      if(f.stay==='motel'){ const m = Math.round(280*MULT[L.cost]); text += ` The motel wants ${M(m)} for another week.`; fx.cash -= m; }
    } else if(k==='uk'){
      if(f.job==='warehouse'){ text = "First weekend pay. £360. You spend £4 on a meal deal to celebrate."; fx = {cash:360, peace:-3}; }
      else if(f.job==='care'){ text = "First care home pay. £640. Your back sends its regards."; fx = {cash:640}; }
      else { text = "Your research assistant pay arrives. £300. Your stipend is still \"processing\"."; fx = {cash:300}; }
    } else {
      if(f.job==='warehouse'){ text = "First pay. C$1,350 after deductions. You learn the words CPP and EI the expensive way."; fx = {cash:1350, peace:-3}; }
      else if(f.job==='care'){ text = "First pay. C$1,200. Your coworker from Ibadan takes you for suya to celebrate."; fx = {cash:1200, peace:3}; }
      else { text = "No pay yet. Your bridging program says the investment is in your future. Your landlord says rent is in the present."; fx = {cash:0, peace:-5}; }
      if(f.stay==='airbnb'){ const m = Math.round(450*MULT[L.cost]); text += ` The Airbnb wants ${M(m)} for another week.`; fx.cash -= m; }
    }
  }
  if(kind==='pay2'){
    if(k==='us'){
      if(f.job==='warehouse'){ text = "Second paycheck, $1,100. Your body has stopped asking questions."; fx = {cash:1100, peace:-3}; }
      else if(f.job==='care'){ text = "Second paycheck, $900. The old man gives you a $50 tip and calls you his favourite."; fx = {cash:950, peace:3}; }
      else { text = "A Nigerian uncle from church refers you. You land a contract role in your field with a $1,600 advance. US experience, finally."; fx = {cash:1600, future:18, peace:6}; }
      if(f.stay==='cousin'){ text += ` ${C().cousin}'s husband asks if you will "contribute to bills". $300.`; fx.cash -= 300; }
      if(f.stay==='motel'){ text += ` You finally move into a room. ${M(RENT()*2)} for deposit and first month.`; fx.cash -= RENT()*2; }
      if(f.stay==='prepaid'){ text += " Rent is already paid. You sleep like a baby."; fx.peace = (fx.peace||0) + 4; }
      if(f.car==='bought'){ text += " Car insurance is $180, which feels like a personal insult."; fx.cash -= 180; }
    } else if(k==='uk'){
      text = "Your PhD stipend finally lands. £1,450. You check the app three times to be sure.";
      fx = {cash:1450, peace:6, future:4};
      if(f.job==='care'){ text += " Plus £640 from the care home."; fx.cash += 640; }
      if(f.job==='warehouse'){ text += " Plus £360 from weekend shifts."; fx.cash += 360; }
      if(f.stay==='room'){ text += ` Rent is due. ${M(RENT())}.`; fx.cash -= RENT(); }
      if(f.stay==='shared'){ const r = Math.round(RENT()*0.78/10)*10; text += ` Rent is due. ${M(r)}, and someone has used your milk.`; fx.cash -= r; }
      if(f.stay==='cousin'){ text += " Your cousin asks for £150 \"for light\". You pay it gladly."; fx.cash -= 150; }
    } else {
      if(f.job==='warehouse'){ text = "Second pay, C$1,350. You now own thermal underwear and you are not ashamed."; fx = {cash:1350, peace:-3}; }
      else if(f.job==='care'){ text = "Second pay, C$1,200. A patient's daughter writes your manager a thank-you card about you."; fx = {cash:1200, peace:4, future:3}; }
      else if(f.network){ text = "The job lead from the owambe calls back. A contract role in your field, with a C$2,000 signing advance. Canadian experience, finally."; fx = {cash:2000, future:18, peace:6}; }
      else { text = "The bridging program connects you to a paid placement. C$600 for now and a reference letter later."; fx = {cash:600, future:8}; }
      if(f.stay==='basement'){ text += ` Basement rent is due. ${M(RENT())}.`; fx.cash -= RENT(); }
      if(f.stay==='host'){ text += " You give your host family C$400 for food and gratitude."; fx.cash -= 400; }
      if(f.stay==='airbnb'){ text += ` You finally rent a basement. ${M(RENT()*2)} for deposit and first month.`; fx.cash -= RENT()*2; }
    }
  }
  if(kind==='roof'){
    const v = (S.v&&S.v.B)||0, c = C();
    if(f.sibling==='sent'){
      text = ["Your neighbour sends a photo of the building. There is no roof. There is a goat.",
              `Your neighbour reports that ${c.sib}'s POS shop is now a phone accessories stand run by his friend. ${c.sib} says it is "a partnership".`,
              "A man calls you from an unknown number to say he owns the land you just paid for. He has documents. Real ones."][v];
      fx = {peace:-10, future:-5};
    } else { text = `Your neighbour mentions, casually, that ${c.sib} just bought a new phone.`; fx = {peace:-4}; }
  }
  return {text, fx};
}

function apply(fx){ for(const k in fx){ S[k] += fx[k]; if(k!=='cash') S[k] = Math.max(0, Math.min(100, S[k])); } }
function money(n){ return (n<0?'-':'') + M(n); }
function chips(fx){
  const names = {cash:'Cash', peace:'Peace', home:'Home', future:'Future'};
  return Object.keys(fx).filter(k=>fx[k]).map(k=>{
    const v = fx[k], up = v>0;
    const val = k==='cash' ? (up?'+':'-')+M(v) : (up?'+':'')+v;
    return `<span class="chip ${up?'up':'down'}">${names[k]} ${val}</span>`;
  }).join('');
}
function header(day){
  const pct = Math.min(100, (day/30)*100);
  const b = v => `<div class="bar"><i style="width:${v}%"></i></div>`;
  return `<div class="pass">
    <div class="pass-top"><div class="brand">LANDED</div><div class="day">DAY ${String(day).padStart(2,'0')} / 30</div></div>
    <div class="route">${S.trail.map(t=>t.code).join(' → ')} → ${R.country} · ${L.town===L.name?L.name:L.town+', '+L.name}</div>
    <div class="stats">
      <div class="stat"><span>Cash</span><b>${money(S.cash)}</b></div>
      <div class="stat"><span>Peace</span><b>${S.peace}</b>${b(S.peace)}</div>
      <div class="stat"><span>Home</span><b>${S.home}</b>${b(S.home)}</div>
      <div class="stat"><span>Future</span><b>${S.future}</b>${b(S.future)}</div>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
}
function nextIndex(from){
  SCENES = scenes();
  let i = from;
  while(i < SCENES.length && SCENES[i].when && !SCENES[i].when(S)) i++;
  return i;
}

function placeOptions(rk){
  const list = places(rk), def = ROUTES[rk].def;
  if(rk!=='uk') return list.map(p=>`<option${p.name===def?' selected':''}>${p.name}</option>`).join('');
  let html = '';
  for(const g in UK_GROUPS){
    html += `<optgroup label="${g}">` + list.filter(p=>p.group===g).map(p=>`<option${p.name===def?' selected':''}>${p.name}</option>`).join('') + `</optgroup>`;
  }
  return html;
}

function render(){
  const app = document.getElementById('app');
  if(phase==='intro'){
    const rk = pick.route;
    app.innerHTML = `<div class="intro fade">
      <div class="stamp">Arrived · Day 01</div>
      <h1>Now You<br>Have Landed<em>The plane landed. Real life began.</em></h1>
      <p>Everybody wants to japa. Nobody tells you what happens after you land.</p>
      <p>You have 30 days. Find work, pay rent, survive the weather, and decide who back home gets your money and who gets your questions.</p>
      <label class="when" for="origin">Which state are you leaving from?</label>
      <select id="origin" class="select">${ORIGIN_LIST.map(([st,city])=>`<option value="${city}"${city===pick.origin?' selected':''}>${st===city?st:st+' · '+city}</option>`).join('')}</select>
      <label class="when" for="culture">Whose voice should your family speak in?</label>
      <select id="culture" class="select">${Object.entries(CULTURES).map(([k,v])=>`<option value="${k}"${k===pick.culture?' selected':''}>${v.label}</option>`).join('')}</select>
      <div class="when">Where are you landing?</div>
      <div class="routes">
        ${Object.values(ROUTES).map(r=>`<button class="route-btn${rk===r.key?' on':''}" data-r="${r.key}" aria-pressed="${rk===r.key}"><b>${r.label}</b><span>${r.sub}</span></button>`).join('')}
      </div>
      ${rk ? `<label class="when" for="place">${ROUTES[rk].ask}</label>
        <select id="place" class="select">${placeOptions(rk)}</select>
        <button class="primary" id="go">Land in ${ROUTES[rk].label}</button>` : ''}
      <div class="foot">About 5 minutes. Every choice follows you.</div>
      <div class="foot small">A fictional game. Costs and situations are illustrative, not immigration or financial advice.</div>
    </div>`;
    document.getElementById('origin').onchange = e => {
      pick.origin = e.target.value;
      const st = (ORIGIN_LIST.find(o=>o[1]===pick.origin)||[])[0];
      pick.culture = STATE_CULTURE[st] || 'general';
      document.getElementById('culture').value = pick.culture;
    };
    document.getElementById('culture').onchange = e => { pick.culture = e.target.value; };
    app.querySelectorAll('.route-btn').forEach(b=>b.onclick=()=>{ pick.route = b.dataset.r; render(); });
    const go = document.getElementById('go');
    if(go) go.onclick = ()=>{ begin(rk, document.getElementById('place').value); render(); scrollTo(0,0); };
    return;
  }
  if(phase==='end'){ return renderEnd(app); }
  SCENES = scenes();
  const sc = SCENES[idx];
  if(phase==='scene' && sc.auto){
    const ev = autoEvent(sc.auto);
    apply(ev.fx); last = {r:ev.text, fx:ev.fx, auto:true}; phase = 'result';
  }
  if(phase==='scene'){
    const list = typeof sc.choices==='function' ? sc.choices(S) : sc.choices;
    const note = sc.day===1 && !sc.from ? `${S.landing>1?`<div class="local"><b>Landing number ${S.landing}</b>You leave ${S.trail[S.trail.length-1].town} and start again. Your peace, family standing, and future come with you. Your savings reset to what you managed to bring.</div>`:''}<div class="local"><b>About ${L.name}</b>${localNote()}</div>` : '';
    app.innerHTML = header(sc.day) + `<div class="scene fade">${intro(sc)}${note}<div class="choices">${list.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${c.l}</span></button>`).join('')}</div>${history.length?`<button class="backbtn" id="back">← Back to the last choice</button>`:''}</div>`;
    wireBack();
    app.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
      const c = list[+btn.dataset.i];
      history.push(JSON.stringify({S, idx}));
      apply(c.fx||{}); Object.assign(S.f, c.set||{});
      last = {r:c.r, fx:c.fx||{}, picked:c.l}; phase='result'; render(); scrollTo(0,0);
    });
    return;
  }
  const picked = last.picked ? `<div class="when">You chose · ${last.picked}</div>` : '';
  const body = (last.auto ? `<div class="when">Day ${sc.day}</div>` : intro(sc,true)) + picked +
    `<div class="result">${last.r}</div><div class="chips">${chips(last.fx)}</div>
     <button class="primary" id="next">${nextIndex(idx+1)>=SCENES.length?'See how your 30 days went':'Continue'}</button>${history.length?`<button class="backbtn" id="back">← Change this choice</button>`:''}`;
  app.innerHTML = header(sc.day) + `<div class="scene fade">${body}</div>`;
  wireBack();
  document.getElementById('next').onclick = ()=>{
    idx = nextIndex(idx+1);
    phase = idx>=SCENES.length ? 'end' : 'scene';
    render(); scrollTo(0,0);
  };
}
function wireBack(){
  const b = document.getElementById('back');
  if(b) b.onclick = ()=>{
    const snap = JSON.parse(history.pop());
    S = snap.S; idx = snap.idx; phase = 'scene'; last = null;
    render(); scrollTo(0,0);
  };
}
function intro(sc, compact){
  if(sc.from){
    return `<div class="when">Day ${sc.day} · New message</div>
      <div class="thread"><div class="who"><div class="avatar">${sc.from[0]}</div><div><b>${sc.from}</b><small>${sc.sub||''}</small></div></div>
      <div class="bubble">${sc.text}</div></div>`;
  }
  return `<div class="when">Day ${sc.day}</div>${compact?'':`<div class="narr">${sc.text}</div>`}`;
}

function verdict(){
  const f = S.f, low = A(300), mid = A(900);
  if(f.sibling==='sent' && S.home>=65 && S.cash<mid) return ["The Family ATM", `Everybody at home is thriving. You are eating Indomie in ${T()}.`];
  if(S.cash<low) return ["Running on Prayers","You made it to day 30 on faith, leftover jollof, and a very patient bank."];
  if(S.peace<35) return ["Hustle Without Peace","The money is coming in. Your body has filed a formal complaint."];
  if(S.home<35) return ["Ghost Mode Activated","Your account is healthy. The family WhatsApp group thinks you have died."];
  if(S.landing>1 && S.future>=40) return ["Serial Japa Champion",`${S.landing} landings and still standing. You have started over more times than most people have moved house.`];
  if(S.future>=45) return ["Abroad Strategist","You protected your money, your peace, and your future. Your mates are taking notes."];
  return ["Still Finding Your Feet","Thirty days in, and you are still standing. That counts for more than people at home will ever know."];
}
function receipts(){
  const f = S.f, out = [], c = C(), vB = (S.v&&S.v.B)||0, vD = (S.v&&S.v.D)||0;
  if(f.sibling==='sent') out.push([`${c.sib} is still at roofing. The goat is doing well.`, `${c.sib}'s POS business is now a phone accessories stand.`, "You own one third of a plot that belongs to three people."][vB]);
  if(f.sibling==='checked') out.push(["You checked the building before paying.", "You checked the POS shop before paying.", "A lawyer saved you from buying a plot sold three times."][vB]);
  if(f.sibling==='video') out.push(["The roof photo had a watermark. You noticed.", "You asked for a business plan. The plan was to make money.", "The land documents said Original in three different fonts."][vB]);
  if(f.car==='bought' && R.key==='us') out.push("Two years of ajo became a Corolla that coughs every morning.");
  if(f.farm==='sent') out.push(["300 birds died of cold in 31°C weather. You paid for it.", "You paid to restock fish that became pepper soup.", "You paid for a borehole the farm already had."][vD]);
  if(f.farm==='counted') out.push([`412 birds alive and loud. ${c.farmer} is now very careful.`, "Your neighbour exposed the catfish pepper soup party.", "Your neighbour found the old borehole. It just needed a tap."][vD]);
  if(f.spouse==='looked') out.push("Every Nigerian man at the fellowship was married or focusing on himself.");
  if(f.network && R.key==='ca') out.push("An owambe at minus 20 got you your first real job lead.");
  if(f.coat==='none') out.push("Naija blood was not enough for the cold.");
  return out.slice(0,4);
}

    box.querySelectorAll('.route-btn').forEach(btn=>btn.onclick=()=>{
      const rk = btn.dataset.r;
      box.innerHTML = `<label class="when" for="place2">${ROUTES[rk].ask}</label><select id="place2" class="select">${placeOptions(rk)}</select><button class="primary" id="go2">Land in ${ROUTES[rk].label}</button>`;
      document.getElementById('go2').onclick = ()=>{
        const prev = {origin:S.origin, trail:S.trail, peace:S.peace, home:S.home, future:S.future, landing:S.landing, culture:S.culture};
        const pl = document.getElementById('place2').value;
        begin(rk, pl, prev); render(); scrollTo(0,0);
      };
    });
  };
}

function start(data){
  fresh();
  if(data && data.rk && data.pn){ R = ROUTES[data.rk]; L = places(data.rk).find(p=>p.name===data.pn); S = data.S; idx = data.idx; phase = data.phase; last = data.last; history = data.history||[]; }
  render();
}
window.claude?.hot?.snapshot?.(()=>({rk:R&&R.key, pn:L&&L.name, S, idx, phase, last, history}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
