<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wahala Week</title>
<meta name="description" content="Survive one week of real life a day, in Lagos, Abuja, Kano, Houston, London, and more. Work, cook, hustle, pray, play Ayo, and pay the bill by Sunday night.">
<meta property="og:title" content="Wahala Week">
<meta property="og:description" content="Survive one week of real life, every day. Abroad or at home in Nigeria.">
<meta property="og:url" content="https://nowyouhavelanded.com/week/">
<meta property="og:image" content="https://nowyouhavelanded.com/og.png">
<meta name="theme-color" content="#16122B">
<link rel="icon" href="/week/icon-192.png">
<link rel="apple-touch-icon" href="/week/apple-touch-icon.png">
<link rel="manifest" href="/week/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wahala Week">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Space+Mono:wght@700&display=swap">
<style>
/* Houston, London or Toronto after dark: sodium light over a city map. HUD on top, map in the middle, action sheet below. One look on purpose. */
:root{
  --night:#16122B; --deep:#0E0B1D; --block:#231D40; --road:#3A3160; --ring:#4A3F7A; --water:#1F4E5A;
  --sun:#FF8A3D; --pink:#FF4F8B; --gold:#FFC93C; --naija:#2DBE6C;
  --ink:#F6F1FF; --dim:#B4AACF; --bad:#FF6B6B;
  --display:"Bungee","Impact",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-size:13px;color:var(--dim);text-decoration:none}
.logo{font-family:var(--display);font-size:22px;line-height:1;background:linear-gradient(90deg,var(--sun),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.when{font-family:var(--display);font-size:13px;color:var(--gold);white-space:nowrap;margin-left:auto}
.snd{border:1px solid var(--road);background:var(--deep);border-radius:10px;width:36px;height:32px;font-size:16px;flex:none}

.hud{display:grid;gap:6px}
.mission{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px;color:var(--dim)}
.mission b{color:var(--ink);font-weight:700}
.target{height:10px;border-radius:5px;background:var(--road);overflow:hidden}
.target i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--gold),#ff8a3d);transition:width .5s}
.target i.ok{background:var(--naija)}
.tnote{font-size:13px;color:var(--dim)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0}
.days span{display:grid;justify-items:center;gap:1px;padding:5px 0;border-radius:9px;background:var(--block);color:var(--dim);font:700 11px var(--body);letter-spacing:.05em}
.days span.past{opacity:.4}
.days span.now{background:linear-gradient(180deg,var(--sun),var(--pink));color:#1A0E14}
.days span i{font-style:normal;font-size:13px;line-height:1}
.tnote b{color:var(--gold);font-family:var(--mono)}
.pin.coach .ic{border-color:var(--naija);animation:glow 1.1s ease-in-out infinite;transform:scale(1.12)}
.coachline{background:rgba(37,211,102,.12);border:1px solid var(--naija);border-radius:12px;padding:10px 12px;font-weight:600}
.welcome.steps>div{align-items:center}
.welcome.steps span{font-size:30px}
.rentline{font-size:12px;color:var(--dim)}
.rentline b{color:var(--gold);font-family:var(--mono)}
.rentline i{display:block;height:5px;border-radius:3px;background:var(--road);margin-top:4px;overflow:hidden}
.rentline i span{display:block;height:100%;background:var(--naija)}
.mission .due{font-family:var(--mono);color:var(--gold);white-space:nowrap}
.lbl{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stats{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center}
.cash{font-family:var(--mono);font-size:22px;color:var(--naija);font-variant-numeric:tabular-nums;transition:color .3s;min-width:5ch}
.cash.down{color:var(--bad)}
.energy{height:10px;border-radius:6px;background:var(--road);overflow:hidden}
.energy i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .5s}
.energy.low i{background:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.warn{color:var(--bad);font-weight:700}
.stars{font-size:16px;letter-spacing:2px;white-space:nowrap}
.stars .on{color:var(--gold);text-shadow:0 0 8px rgba(255,201,60,.7)}
.stars .off{color:var(--road)}
.stars.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

.radio{display:flex;gap:8px;align-items:center;background:var(--deep);border:1px solid var(--road);border-radius:10px;padding:7px 10px;overflow:hidden;min-width:0}
.radio b{font-family:var(--display);font-size:11px;color:var(--pink);white-space:nowrap;font-weight:400}
.radio .tk{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.radio .tk span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite;font-size:13px;color:var(--dim)}
@keyframes tick{to{transform:translateX(-100%)}}

.map{position:relative;aspect-ratio:9/10;max-width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--road);background:var(--block)}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.sky{position:absolute;inset:0;pointer-events:none;transition:background 1.2s}
.pin.k-earn .ic{border-color:#FFC93C;box-shadow:0 0 0 4px rgba(255,201,60,.18),0 6px 14px rgba(0,0,0,.4)}
.pin.k-home .ic{border-color:#2DBE6C;box-shadow:0 0 0 4px rgba(45,190,108,.18),0 6px 14px rgba(0,0,0,.4)}
.pin.k-faith .ic{border-color:#FF4F8B;box-shadow:0 0 0 4px rgba(255,79,139,.18),0 6px 14px rgba(0,0,0,.4)}
.pin.k-play .ic{border-color:#5FA9F8;box-shadow:0 0 0 4px rgba(95,169,248,.18),0 6px 14px rgba(0,0,0,.4)}
.pin.k-grow .ic{border-color:#2DD4BF;box-shadow:0 0 0 4px rgba(45,212,191,.18),0 6px 14px rgba(0,0,0,.4)}
.pin.k-errand .ic{border-color:#B4AACF;box-shadow:0 0 0 4px rgba(180,170,207,.16),0 6px 14px rgba(0,0,0,.4)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--dim);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.kindtag{display:inline-block;justify-self:start;width:max-content;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:999px;border:1px solid currentColor;margin-bottom:4px}
.pin{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;background:none;border:0;padding:4px;z-index:2}
.pin .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--night);border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(255,201,60,.15),0 6px 14px rgba(0,0,0,.4);transition:transform .15s}
.pin:hover .ic{transform:scale(1.08)}
.pin .nm{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(14,11,29,.88);padding:2px 6px;border-radius:6px;white-space:nowrap}
.pin.shut{opacity:.38}
.pin.shut .ic{border-color:var(--dim)}
.pin.new .ic{border-color:var(--naija);animation:glow 1.4s ease-in-out infinite}
.pin.new .nm::after{content:" NEW";color:var(--naija)}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(45,190,108,.25),0 6px 14px rgba(0,0,0,.4)}}
.me{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--naija);border:3px solid var(--ink);transform:translate(-50%,-50%);transition:left .9s ease-in-out,top .9s ease-in-out;box-shadow:0 0 14px var(--naija);z-index:3;pointer-events:none;display:grid;place-items:center;font-size:24px;line-height:1}
.me::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--naija);animation:ping 1.6s ease-out infinite}
.me .mb{position:absolute;right:-8px;bottom:-6px;font-size:15px}
.you{position:relative;justify-self:start;display:flex;align-items:flex-end;gap:2px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--block);border:1px solid var(--road)}
.you .yf{font-size:34px;line-height:1}
.you .yb{font-size:20px;line-height:1;margin-left:-6px}
.you small{align-self:center;margin-left:8px;color:var(--dim);font-size:12px}
.mood{font-size:40px;line-height:1;animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
.whoami{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.whoami button{display:grid;justify-items:center;gap:6px;border:1px solid var(--road);background:var(--block);border-radius:14px;padding:14px 6px;font-size:13px}
.whoami button span{font-size:44px;line-height:1}
.whoami button:hover{border-color:var(--gold)}
.whoami button.on{border-color:var(--gold);background:rgba(255,201,60,.12)}
.whoami.fam{grid-template-columns:repeat(2,1fr)}
.whoami.fam button span{font-size:32px}
.go:disabled{opacity:.45}
@keyframes ping{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.phone{position:absolute;right:10px;bottom:10px;z-index:4;border:0;border-radius:14px;background:var(--naija);color:#08210F;font-weight:700;padding:9px 12px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:buzz 2.4s ease-in-out infinite}
.phone .n{background:var(--pink);color:var(--ink);border-radius:10px;padding:0 7px;font-size:12px}
@keyframes buzz{0%,86%,100%{transform:none}88%{transform:rotate(-6deg)}92%{transform:rotate(6deg)}96%{transform:rotate(-3deg)}}

.sheet{background:var(--deep);border:1px solid var(--road);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.sheet h2{margin:0;font-family:var(--display);font-size:17px;font-weight:400;color:var(--gold);text-wrap:balance}
.sheet p{margin:0}
.who{font-size:12px;color:var(--dim)}
.acts{display:grid;gap:8px}
.act{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--road);background:var(--block);border-radius:12px;padding:11px 12px;min-width:0}
.act:hover{border-color:var(--gold)}
.act small{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
.act[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:8px;background:var(--block)}
.chip.g{color:var(--naija)} .chip.b{color:var(--bad)}
.go{border:0;border-radius:12px;padding:13px;background:linear-gradient(90deg,var(--sun),var(--pink));color:#1A0E14;font-weight:700;width:100%}
.ghost{border:1px solid var(--road);background:none;border-radius:12px;padding:11px;width:100%}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,7,22,.95);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;animation:fade .3s}
.overlay .box{max-width:460px;width:100%;display:grid;gap:12px;text-align:center;padding-block:24px}
.eyebrow{font-family:var(--display);font-size:13px;color:var(--dim);letter-spacing:.05em}
.big{font-family:var(--display);font-size:clamp(32px,10vw,52px);line-height:1;letter-spacing:.02em;animation:slam .5s cubic-bezier(.2,1.6,.4,1);text-wrap:balance}
.big.win{color:var(--gold);text-shadow:0 4px 0 #8A5A00,0 0 30px rgba(255,201,60,.5)}
.big.lose{color:var(--bad);text-shadow:0 4px 0 #6A1020}
.big.plain{color:var(--ink);text-shadow:0 4px 0 #3A3160}
.sub{font-family:var(--display);font-size:15px}
.recap{background:var(--deep);border:1px solid var(--road);border-radius:14px;padding:12px;display:grid;gap:6px;text-align:left;font-size:14px}
.recap div{display:flex;justify-content:space-between;gap:10px}
.recap span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.recap p{margin:0}
.recap .hr{border-top:1px solid var(--road);margin-top:4px;padding-top:8px}
.daycard{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none;background:rgba(10,7,22,.55);animation:fade .2s}
.daycard .dw{display:block;text-align:center;font-size:.6em;text-shadow:none}
.daycard small{display:block;font-size:.32em;text-align:center;color:var(--gold);text-shadow:none;letter-spacing:.2em}
.daycard div{font-family:var(--display);font-size:clamp(44px,14vw,80px);color:var(--ink);text-shadow:0 5px 0 var(--pink);animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:26;width:min(92vw,460px);background:var(--ink);color:var(--night);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.4);animation:fade .25s}
.cities{display:grid;gap:10px}
.city{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--road);background:var(--block);border-radius:14px;padding:14px}
.city:hover{border-color:var(--gold)}
.city .fl{grid-row:span 2;font-size:30px}
.city b{font-family:var(--display);font-weight:400;font-size:16px}
.city small{color:var(--dim)}
.placepanel{display:grid;gap:8px;padding:4px 2px 8px}
.select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ring);background:var(--deep);color:var(--ink);font:16px var(--body)}
.prog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.prog span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--block);color:var(--dim)}
.prog span.on{color:var(--naija)}
.note{font-size:12px;color:var(--dim);text-align:center}
.hometip{border:1px solid var(--ring);border-radius:14px;padding:12px 14px;display:grid;gap:8px;text-align:left;background:rgba(255,201,60,.06)}
.hometip b.t{color:var(--gold);font-size:13px;letter-spacing:.06em}
.hometip p{margin:0;font-size:14px}
.hometip textarea{width:100%;min-height:64px;border-radius:10px;border:1px solid var(--road);background:var(--deep);color:var(--ink);font:12px var(--mono);padding:8px}
.newmap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:var(--deep);border:1px solid var(--naija);border-radius:14px;padding:10px}
.newmap b{width:100%;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--naija)}
.newmap span{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--block)}
.welcome{display:grid;gap:8px;text-align:left}
.welcome div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--deep);border:1px solid var(--road);border-radius:12px;padding:10px 12px}
.welcome div span{font-size:24px;line-height:1}
.welcome p{margin:0}
.small-link{font-size:13px;color:var(--dim)}
.drive{position:fixed;inset:0;z-index:22;background:rgba(10,7,22,.96);display:grid;place-items:center;padding:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));animation:fade .25s}
.dbox{display:grid;gap:10px;justify-items:center;max-width:420px;width:100%;position:relative}
.dhead{display:flex;justify-content:space-between;gap:10px;width:100%;font-size:13px;color:var(--dim)}
.dhead b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:15px}
#dcv{border-radius:14px;border:1px solid var(--road);touch-action:none;max-width:100%}
.dhelp{position:absolute;inset:40px 10px auto;display:grid;gap:10px;background:rgba(14,11,29,.94);border:1px solid var(--road);border-radius:14px;padding:16px;text-align:center}
.dhelp p{margin:0}
.mgbody{width:100%;display:grid;gap:10px}
.ckbar,.pscore{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:14px}
.ckq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ckc{background:var(--block);border:1px solid var(--road);border-radius:12px;padding:8px;display:grid;gap:4px;text-align:center;min-width:0}
.ckc.empty{color:var(--dim);place-items:center;min-height:110px}
.ckc .ckd{font-size:30px;line-height:1}
.ckc b{font-size:12px;line-height:1.2}
.ckc small{font-size:16px}
.ckc i{display:block;height:6px;border-radius:3px;background:var(--road);overflow:hidden}
.ckc i span{display:block;height:100%}
.ckplate{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--deep);border:1px dashed var(--gold);border-radius:12px;padding:10px;font-size:14px;min-height:52px}
.ckbin{border:1px solid var(--road);background:var(--block);border-radius:10px;padding:6px 8px;font-size:12px;white-space:nowrap}
.ckgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ckin{display:grid;justify-items:center;gap:2px;border:1px solid var(--road);background:var(--block);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600}
.ckin span{font-size:28px;line-height:1}
.ckin:active{transform:scale(.95);border-color:var(--gold)}
.ayo{display:grid;gap:8px;text-align:center}
.ayst{font-size:15px}
.ayrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#5A3A1E;border-radius:14px;padding:8px}
.ayrow.top{background:#4A2F18}
.pit{aspect-ratio:1;border-radius:50%;background:#2E1C0E;border:2px solid #7A5230;color:#F3D9A4;display:grid;place-items:center;align-content:center;font-size:8px;line-height:1;letter-spacing:1px;padding:2px;word-break:break-all;overflow:hidden}
.pit span{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:0}
.pit.mine{cursor:pointer;border-color:var(--gold)}
.pit.mine:disabled{border-color:#7A5230;cursor:default}
.aymsg{min-height:1.4em;margin:0;color:var(--gold)}
.pen{display:grid;gap:12px;text-align:center}
.pscore{justify-content:center;font-size:22px}
.pt{margin:0;font-size:16px}
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:4px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;padding:10px 8px;background:repeating-linear-gradient(90deg,#1E5A2C 0 20px,#236633 20px 40px)}
.goal button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:var(--ink);border-radius:8px;padding:28px 4px;font-weight:700}
.goal button.pick{background:var(--gold);color:var(--night)}
.goal button.keeper::after{content:" 🧤"} .goal button.ball::after{content:" ⚽"}
.pres{margin:0;font-family:var(--display);font-size:18px;color:var(--gold);min-height:1.4em}
canvas.confetti{position:fixed;inset:0;z-index:21;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.radio .tk span{animation:none;padding-left:0}.me{transition:none}.me::after,.phone,.pin.new .ic{animation:none}.big,.daycard div{animation:none}}
</style>
</head>

<div class="wrap">

  cv.addEventListener('pointerup', e => { if(sx === null) return; const dx = e.clientX - sx; if(Math.abs(dx) > 25) move(dx > 0 ? 1 : -1); else { const r = cv.getBoundingClientRect(); move(e.clientX - r.left < r.width / 2 ? -1 : 1); } sx = null; });
  addEventListener('keydown', key);
  function draw(now){
    const el = run ? (now - t0) / 1000 : 0, left = Math.max(0, DUR - el), dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
    const speed = 240 + el * 11; if(run) dist += speed * dt;
    carX += (laneX(car) - carX) * Math.min(1, dt * 14);
    // road
    g.fillStyle = ng ? '#3B3324' : '#2B2450'; g.fillRect(0, 0, W0, H0);
    g.fillStyle = '#3A3A44'; g.fillRect(16, 0, W0 - 32, H0);
    g.fillStyle = ng ? '#C9A227' : '#FFC93C'; g.fillRect(14, 0, 3, H0); g.fillRect(W0 - 17, 0, 3, H0);
    g.fillStyle = 'rgba(255,255,255,.55)'; for(let l = 1; l < lanes; l++){ const x = 20 + laneW * l - 2; for(let yy = (dist % 60) - 60; yy < H0; yy += 60) g.fillRect(x, yy, 4, 30); }
    // things on the road
    const carY = H0 - 70;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for(const it of items){
      if(it.gone) continue;
      const sy = it.y + dist + (it.moving ? -dist * 0.25 : 0);
      if(sy < -60 || sy > H0 + 60) continue;
      if(it.cop){
        const gap = it.lane; g.font = '30px system-ui';
        for(let l = 0; l < 3; l++) if(l !== gap) g.fillText(ng ? '🚧' : '🚓', laneX(l), sy);
        if(run && !it.done && Math.abs(sy - carY) < 30){ it.done = true; if(car !== gap){ cop = true; flash = 1; SND.pressure(); toast(ng ? '👮🏾 Checkpoint. "Anything for the boys?"' : '🚓 Pulled over. Ticket.'); } }
        continue;
      }
      if(it.coin){ g.font = '28px system-ui'; g.fillText('💵', laneX(it.lane), sy); }
      else { g.font = it.ic === '🕳️' ? '30px system-ui' : '34px system-ui'; g.fillText(it.ic, laneX(it.lane), sy); }
      if(run && it.lane === car && Math.abs(carX - laneX(car)) < laneW * .35 && Math.abs(sy - carY) < (it.coin ? 32 : 24)){
        it.gone = true;
        if(it.coin){ coins++; SND.cashIn(); } else { hits++; flash = 1; SND.pressure(); if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){} }
      }
    }
    // your car
    g.save(); g.translate(carX, carY); if(flash > 0) g.rotate(Math.sin(now / 30) * 0.15 * flash);
    g.fillStyle = '#2DBE6C'; g.beginPath(); g.roundRect ? g.roundRect(-17, -30, 34, 60, 9) : g.rect(-17, -30, 34, 60); g.fill();
    g.fillStyle = '#0E0B1D'; g.fillRect(-12, -18, 24, 12); g.fillRect(-12, 10, 24, 9);
    g.fillStyle = '#FFC93C'; g.fillRect(-14, -31, 7, 4); g.fillRect(7, -31, 7, 4);
    g.font = '18px system-ui'; g.textAlign = 'center'; g.fillText(me().base, 0, -2);
    g.restore();
    if(flash > 0){ g.fillStyle = `rgba(255,107,107,${flash * .35})`; g.fillRect(0, 0, W0, H0); flash = Math.max(0, flash - dt * 2.5); }
    // dashboard
    g.fillStyle = 'rgba(14,11,29,.8)'; g.fillRect(0, 0, W0, 34);
    g.font = '700 14px Rubik, system-ui'; g.fillStyle = '#F6F1FF'; g.textAlign = 'left'; g.fillText(`⏱ ${left.toFixed(1)}s`, 10, 17);
    g.textAlign = 'center'; g.fillText(`💵 ${coins}`, W0 / 2, 17);
    g.textAlign = 'right'; g.fillText('🔧'.repeat(Math.max(0, 3 - hits)) + '💥'.repeat(Math.min(3, hits)), W0 - 10, 17);
    if(run && (left <= 0 || hits >= 3)) return finish();
    raf = requestAnimationFrame(draw);
  }
  function finish(){ run = false; over = true; cancelAnimationFrame(raf); removeEventListener('keydown', key);
    const msg = hits >= 3 ? '💥 Breakdown' : (!hits && !cop && coins >= 7) ? '⭐ Clean run' : '🏁 Done';
    $('dinfo').textContent = msg; setTimeout(() => { ov.remove(); cb({coins, hits, cop}); }, 900); }
  $('dstart').onclick = () => { $('dhelp').hidden = true; SND.init(); let n = 3; $('dinfo').textContent = 'Get ready… 3';
    const tick = setInterval(() => { n--; if(n > 0){ $('dinfo').textContent = 'Get ready… ' + n; SND.tap(); } else { clearInterval(tick); $('dinfo').textContent = 'Drive!'; run = true; t0 = performance.now(); last = 0; } }, 600); };
  $('dauto').onclick = () => { cancelAnimationFrame(raf); removeEventListener('keydown', key); ov.remove();
    cb({coins: 6 + Math.floor(luck(seed + 'auto') * 4), hits: luck(seed + 'ahit') < .25 ? 1 : 0, cop: luck(seed + 'acop') < .2}); };
  window.__drive = () => ({items, car, dist, carY: H0 - 70, run, coins, hits});   // read-only peek for the automated tests
  raf = requestAnimationFrame(draw);
}

/* ---------- mini-games share one full-screen frame with a skip button ---------- */
function mgFrame(title, sub, help, startLabel, skipLabel, onStart, onSkip){
  const ov = document.createElement('div'); ov.className = 'drive mg'; ov.id = 'mg';
  ov.innerHTML = `<div class="dbox"><div class="dhead"><b>${title}</b><span id="mginfo">${sub}</span></div><div class="mgbody" id="mgbody"></div>
    <div class="dhelp" id="mghelp"><p>${help}</p><button class="go" type="button" id="mgstart">${startLabel}</button><button class="ghost" type="button" id="mgauto">${skipLabel}</button></div></div>`;
  document.body.appendChild(ov);
  $('mgstart').onclick = () => { $('mghelp').hidden = true; SND.init(); onStart(); };
  $('mgauto').onclick = () => { ov.remove(); onSkip(); };
  return ov;
}

/* ---------- cooking rush: build each plate before the customer loses patience ---------- */
const DISHES = {
  jollof:{n:'Jollof rice', ic:'🍛', need:['rice','pepper','chicken']},
  amala:{n:'Amala and ewedu', ic:'🥘', need:['amala','ewedu','stew']},
  iyan:{n:'Pounded yam and egusi', ic:'🍲', need:['iyan','egusi','beef']},
  suya:{n:'Suya', ic:'🍢', need:['beef','yaji']},
  fried:{n:'Fried rice and dodo', ic:'🍚', need:['rice','dodo','chicken']}
};
const ING = {rice:['🍚','Rice'], pepper:['🌶️','Pepper mix'], chicken:['🍗','Chicken'], amala:['🟫','Amala'], ewedu:['🥬','Ewedu'], stew:['🍅','Stew'], iyan:['⚪','Pounded yam'], egusi:['🥣','Egusi'], beef:['🥩','Beef'], yaji:['🧂','Yaji'], dodo:['🍌','Dodo']};
const DINERS = ['👨🏾‍🦳','👩🏾‍🦱','🧔🏾','👵🏾','👷🏾‍♂️','👩🏾‍💼','🧑🏾‍🎓','👨🏾‍🔧'];
function cook(kind, cb){
  const big = kind === 'cater', seed = 'cook' + kind + P.week + '-' + T(), DUR = big ? 50 : 45, PAT = big ? 16 : 18;
  const pay = big ? A(16) : A(12);
  const ov = mgFrame(big ? '🍲 OWAMBE KITCHEN' : '🍲 KITCHEN RUSH', 'Same orders for everyone today',
    `<b>Customers are waiting.</b> Tap the ingredients for each order, and the plate goes out by itself when it matches. Too slow and they walk out. ${money(pay)} a plate, plus tips for fast service.`,
    'Start cooking', big ? 'Just serve the drinks (no tips)' : 'Just wash the plates (no tips)',
    () => run(), () => cb({served: big ? 5 : 4, lost:0, tips:0}));
  const body = $('mgbody'), keys = Object.keys(DISHES);
  body.innerHTML = `<div class="ckbar"><span id="cktime">⏱ ${DUR}s</span><span id="ckserved">🍽️ 0 served</span><span id="ckmiss">🚶🏾 0 left</span></div>
    <div class="ckq" id="ckq"></div>
    <div class="ckplate"><span id="ckplate">Your plate is empty</span><button type="button" class="ckbin" id="ckbin">🗑️ Start again</button></div>
    <div class="ckgrid">${Object.entries(ING).map(([k, [e, n]]) => `<button type="button" class="ckin" data-i="${k}"><span>${e}</span>${n}</button>`).join('')}</div>`;
  let q = [], plate = [], served = 0, lost = 0, tips = 0, t0 = 0, n = 0, nextAt = 0, on = false, iv = 0;
  const show = () => {
    $('ckq').innerHTML = [0, 1, 2].map(i => { const c = q[i]; if(!c) return '<div class="ckc empty">…</div>';
      const d = DISHES[c.d], left = Math.max(0, 1 - (performance.now() - c.at) / 1000 / PAT);
      return `<div class="ckc"><span class="ckd">${c.who}</span><b>${d.ic} ${d.n}</b><small>${d.need.map(x => ING[x][0]).join(' ')}</small><i><span style="width:${left*100}%;background:${left < .3 ? 'var(--bad)' : 'var(--naija)'}"></span></i></div>`; }).join('');
    $('ckplate').textContent = plate.length ? plate.map(x => ING[x][0] + ' ' + ING[x][1]).join(' + ') : 'Your plate is empty';
    $('ckserved').textContent = `🍽️ ${served} served`; $('ckmiss').textContent = `🚶🏾 ${lost} left`;
  };
  const tryServe = () => {
    const key = [...plate].sort().join();
    const i = q.findIndex(c => [...DISHES[c.d].need].sort().join() === key);
    if(i < 0) return;
    const c = q[i], fast = (performance.now() - c.at) / 1000 < PAT * .45;
    q.splice(i, 1); plate = []; served++; if(fast) tips++; SND.cashIn(); toast(fast ? `⭐ Fast! ${c.who} adds a tip.` : `${c.who} is happy.`);
  };
  body.querySelectorAll('.ckin').forEach(b => b.onclick = () => { if(!on) return; SND.tap(); if(plate.length < 4) plate.push(b.dataset.i); tryServe(); show(); });
  $('ckbin').onclick = () => { plate = []; show(); };
  function run(){
    on = true; t0 = performance.now(); nextAt = 0;
    iv = setInterval(() => {
      const el = (performance.now() - t0) / 1000;
      if(el >= nextAt && q.length < 3){ q.push({d: keys[Math.floor(luck(seed + n) * (big ? keys.length : 4))], who: DINERS[Math.floor(luck(seed + 'w' + n) * DINERS.length)], at: performance.now()}); n++; nextAt = el + (big ? 3.2 : 4); SND.ping(); }
      for(let i = q.length - 1; i >= 0; i--) if((performance.now() - q[i].at) / 1000 > PAT){ q.splice(i, 1); lost++; SND.pressure(); }
      $('cktime').textContent = `⏱ ${Math.max(0, DUR - el).toFixed(0)}s`; show();
      if(el >= DUR){ clearInterval(iv); on = false; $('mginfo').textContent = '🏁 Kitchen closed'; setTimeout(() => { ov.remove(); cb({served, lost, tips}); }, 900); }
    }, 200);
    show();
  }
  show();
}
function cookResult(kind, r){
  const per = kind === 'cater' ? A(28) : A(20), cash = r.served * per + r.tips * A(6);
  const good = r.served >= (kind === 'cater' ? 9 : 7);
  done({cash, energy:-30, peace: good ? 8 : r.lost > 3 ? -4 : 2, ...(kind === 'cater' ? {stars:-1} : {})},
    (good ? (kind === 'cater' ? 'The caterer says she has never seen hands move so fast. She asks for your number for the next owambe.' : `${NG() ? 'Iya' : 'Mama'} says you can come back any day. That is the highest praise she gives.`)
          : r.lost > 3 ? 'Some customers walked out hungry. The kitchen was a battlefield, and the stew won.' : 'A busy shift. Your feet hurt, but every plate went out hot.')
    + ` (${r.served} plates served${r.tips ? `, ${r.tips} tips` : ''}${r.lost ? `, ${r.lost} walked out` : ''}.)`);
}

/* ---------- Ayo: two rows of six pits, four seeds each, against Baba Sule ---------- */
function ayo(cb){
  const ov = mgFrame('🎲 AYO', 'You against Baba Sule',
    '<b>Tap one of your pits</b> (the bottom row) to sow its seeds one by one, round the board. If your last seed lands on Baba\'s side and makes 2 or 3, you take them. Most seeds wins.',
    'Play Baba Sule', 'Just watch and drink zobo', () => start(), () => cb({me:20, baba:28, quit:true}));
  const b = Array(12).fill(4), store = [0, 0]; let turn = 0, busyA = false, moves = 0;
  // pits 0-5 are yours (left to right), 6-11 are Baba's (right to left on top)
  const body = $('mgbody');
  const draw = (msg) => {
    body.innerHTML = `<div class="ayo"><div class="ayst">👴🏾 Baba Sule: <b>${store[1]}</b></div>
      <div class="ayrow top">${[11,10,9,8,7,6].map(i => `<div class="pit" data-p="${i}"><span>${b[i]}</span>${'•'.repeat(Math.min(b[i], 12))}</div>`).join('')}</div>
      <div class="ayrow">${[0,1,2,3,4,5].map(i => `<button type="button" class="pit mine" data-p="${i}" ${b[i] && turn === 0 && !busyA ? '' : 'disabled'}><span>${b[i]}</span>${'•'.repeat(Math.min(b[i], 12))}</button>`).join('')}</div>
      <div class="ayst">${me().base} You: <b>${store[0]}</b></div><p class="aymsg">${msg || ''}</p><button type="button" class="ghost" id="ayquit">Stop and go home</button></div>`;
    body.querySelectorAll('button.pit').forEach(x => x.onclick = () => play(0, +x.dataset.p));
    $('ayquit').onclick = () => finish(true);
  };
  const side = (pl, i) => pl === 0 ? i < 6 : i >= 6;
  const sow = (pl, i, sim) => { const bb = sim ? sim.b : b, st = sim ? sim.st : store; let n = bb[i], j = i; bb[i] = 0;
    while(n > 0){ j = (j + 1) % 12; if(j === i) continue; bb[j]++; n--; }
    let got = 0; while(!side(pl, j) && (bb[j] === 2 || bb[j] === 3)){ got += bb[j]; bb[j] = 0; j = (j + 11) % 12; }
    st[pl] += got; return got; };
  const can = pl => [0,1,2,3,4,5].map(x => pl ? x + 6 : x).filter(x => b[x] > 0);
  function play(pl, i){
    if(busyA || turn !== pl || !b[i]) return;
    busyA = true; moves++; const got = sow(pl, i); SND.tap(); if(got) SND.cashIn();
    turn = 1 - pl;
    draw(pl === 0 ? (got ? `You take ${got}! 🙌🏾` : 'Baba is thinking…') : (got ? `Baba takes ${got}. He laughs and sips zobo.` : 'Your turn.'));
    const over = store[0] > 24 || store[1] > 24 || !can(turn).length || moves > 120;
    setTimeout(() => { busyA = false; if(over) return finish(false); if(turn === 1) babaMove(); else draw('Your turn.'); }, pl === 0 ? 700 : 350);
  }
  function babaMove(){
    const opts = can(1); let best = opts[0], bestGot = -1;
    opts.forEach((i, k) => { const sim = {b:[...b], st:[0, 0]}; const g = sow(1, i, sim) + luck('ayo' + moves + k) * .5; if(g > bestGot){ bestGot = g; best = i; } });
    play(1, best);
  }
  function finish(quit){
    // whoever still has seeds on their side keeps them
    for(let i = 0; i < 12; i++){ store[i < 6 ? 0 : 1] += b[i]; b[i] = 0; }
    $('mginfo').textContent = quit ? 'You stopped' : store[0] > store[1] ? '🏆 You win' : store[0] < store[1] ? 'Baba wins' : 'Draw';
    setTimeout(() => { ov.remove(); cb({me:store[0], baba:store[1], quit}); }, 1000);
  }
  function start(){ draw('Your turn. Pick a pit with seeds.'); }
}
function ayoResult(r){
  const win = !r.quit && r.me > r.baba;
  done({energy:10, peace: win ? 14 : 7, cash: win ? 0 : -A(5)}, r.quit && r.me === 20 ? 'You sit with the old men, drink cold zobo, and watch Baba Sule beat three people in a row. Your shoulders finally come down.'
    : win ? `You beat Baba Sule, ${r.me} to ${r.baba}. The whole tree goes quiet. He says it was luck, then asks for a rematch tomorrow.`
    : `Baba Sule wins, ${r.baba} to ${r.me}. "You young people play too fast." You buy the zobo, as the rule says.`);
}

function apply(fx){
  const before = P.cash;
  if(fx.cash){ P.cash += Math.round(fx.cash); if(fx.cash > 0){ W.log.earned += fx.cash; SND.cashIn(); } else SND.cashOut(); }
  if(fx.energy) W.energy = Math.max(0, Math.min(100, W.energy + fx.energy));
  if(fx.peace) W.peace = Math.max(0, Math.min(100, W.peace + fx.peace));
  if(fx.stars){ W.stars = Math.max(0, Math.min(5, W.stars + fx.stars)); if(fx.stars > 0){ bumpStars(); SND.pressure(); } }
  return before;
}
function chips(fx){
  const c = [];
  if(fx.cash) c.push([fx.cash > 0, (fx.cash > 0 ? '+' : '') + money(fx.cash)]);
  if(fx.energy) c.push([fx.energy > 0, (fx.energy > 0 ? '+' : '') + fx.energy + ' energy']);
  if(fx.peace) c.push([fx.peace > 0, (fx.peace > 0 ? '+' : '') + fx.peace + ' peace']);
  if(fx.stars) c.push([fx.stars < 0, (fx.stars > 0 ? '+' : '') + fx.stars + ' ★']);

function done(fx, text, unlock){

  W.tiredJob = false;

  if(W.energy > 0 && W.energy < 20 && (fx.energy || 0) < 0) setTimeout(() => toast('⚠️ Your body is warning you. Rest before you crash.'), 600); save(); hud(before);
  const last = lastSlot();
  const homeRyde = W.offerHome && W.energy >= 15; W.offerHome = false;
  sheet(`<div class="mood" aria-hidden="true">${moodFx(fx)}</div><p>${text}</p>${chips(fx)}${unlock ? `<p class="who" style="color:var(--naija)">${unlock}</p>` : ''}<button class="go" type="button" id="next">${last ? 'Sunday night. Time to pay.' : 'Next'}</button>${homeRyde ? '<button class="ghost" type="button" id="rydehome">🚗 Ryde on the way home</button>' : ''}`);
  $('next').onclick = advance;
  if(homeRyde) $('rydehome').onclick = () => { W.log.rides++; W.rodeHome = W.day; drive(res => { const r = rydeCommute(res, true), b = apply(r.fx); W.at = 'home'; save(); hud(b);
    sheet(`<div class="mood" aria-hidden="true">${moodFx(r.fx)}</div><p>${r.text}</p>${chips(r.fx)}<button class="go" type="button" id="next">${last ? 'Sunday night. Time to pay.' : 'Next'}</button>`); $('next').onclick = advance; showSheet(); }); };
  if(unlock) toast(unlock);

/* ---------- time moves ---------- */
let busy = false;
function dayCard(t, cb){ busy = true; SND.day(); const d = document.createElement('div'); d.className = 'daycard'; d.innerHTML = `<div>${P && P.me ? `<span class="dw">${me().walk}</span>` : ''}${t}<small>MORNING</small></div>`; document.body.appendChild(d); setTimeout(() => { d.remove(); busy = false; cb && cb(); }, 1400); }
function advance(){
  if(busy || W.over) return;
  const nx = $('next'); if(nx) nx.disabled = true;
  if(lastSlot()) return friday();
  W.slot++; let newDay = false;

      <p>⚠️ <b>Surprises.</b> Once or twice a week, life gets in the way.</p>
      <p>🎮 <b>Little games.</b> The Ryde run, the kitchen rush, Ayo, ludo, draft, 5-aside penalties, and PES.</p>
      <p>📈 <b>Life carries on.</b> Your money moves to next week. Fix your car, take classes, open a stall.</p>
      <p>❌ <b>Miss a bill</b> and the gap rolls over with a late fee. Three misses and you start again.</p>
      <p>👥 <b>Same day, same week.</b> Everyone playing today gets the same surprises and roads. Share your week and compare.</p>
    </div><button class="go" type="button">Got it</button></div>`;
  box.querySelector('.go').insertAdjacentHTML('beforebegin', `${homeTipHTML(false)}<div class="hometip"><b class="t">🔁 MOVE MY WEEKS</b><p>Playing on a new phone, or from the home screen? Copy your code here and paste it there.</p><button class="ghost" type="button" id="copycode2">Copy my code</button><button class="ghost" type="button" id="pastecode">Paste a code</button></div>`);
  box.querySelector('.box').insertAdjacentHTML('beforeend', '<a class="small-link" href="/" style="text-align:center">Also from us: Now You Have Landed, a story game about life abroad</a>');
  document.body.appendChild(box); box.querySelector('.go').onclick = () => box.remove();
  wireHomeTip();
  const cc = box.querySelector('#copycode2');
  cc.onclick = async () => { const code = saveCode(); track('copy-code'); try{ await navigator.clipboard.writeText(code); cc.textContent = 'Copied ✓'; }catch(e){ cc.insertAdjacentHTML('afterend', `<textarea readonly>${code}</textarea>`); const ta = cc.nextElementSibling; ta.focus(); ta.select(); cc.textContent = 'Copy the code below'; } };
  box.querySelector('#pastecode').onclick = () => { box.remove(); pasteCodeBox(); };
};
if(!isStandalone()) $('addapp').hidden = false;
$('addapp').onclick = () => {
  track('addapp');
  if(installEvt && !isIOS()){ installEvt.prompt(); installEvt.userChoice.then(r => { if(r && r.outcome === 'accepted') $('addapp').hidden = true; }).catch(()=>{}); installEvt = null; return; }
  const box = document.createElement('div'); box.className = 'overlay';
  box.innerHTML = `<div class="box"><div style="font-size:56px;line-height:1" aria-hidden="true">📲</div><div class="big plain" style="font-size:clamp(26px,7vw,36px)">ADD TO YOUR PHONE</div>
    ${isIOS() ? `<div class="welcome steps"><div><span>1</span><p>Tap the <b>Share</b> button at the bottom of Safari (the square with an arrow ⬆️).</p></div><div><span>2</span><p>Scroll down and tap <b>Add to Home Screen</b>.</p></div><div><span>3</span><p>Tap <b>Add</b>. Wahala Week now sits on your phone like an app.</p></div></div>`
    : `<div class="welcome steps"><div><span>1</span><p>Tap the <b>⋮ menu</b> at the top of Chrome.</p></div><div><span>2</span><p>Tap <b>Add to Home screen</b> or <b>Install app</b>.</p></div><div><span>3</span><p>Tap <b>Add</b>. Wahala Week now sits on your phone like an app.</p></div></div>`}
    ${homeTipHTML(true).includes('copycode') ? '<p class="note">Already played some weeks? Copy your code first, then paste it in the app.</p><button class="ghost" type="button" id="copycode">Copy my code</button>' : ''}
    <button class="go" type="button" id="addok">Got it</button></div>`;
  document.body.appendChild(box); box.querySelector('#addok').onclick = () => box.remove(); wireHomeTip();
};
$('snd').onclick = () => { const on = SND.toggle(); $('snd').textContent = on ? '🔊' : '🔇'; $('snd').setAttribute('aria-label', on ? 'Sound on' : 'Sound off'); };

let tt;
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 3800); }

/* ---------- screens ---------- */
function welcome(){
  $('obox').innerHTML = `<div class="eyebrow">A NEW WEEK, EVERY DAY</div><div class="big plain">WAHALA WEEK</div>
    <p style="font-size:17px">One week of everyday hustle, every day.</p>
    <div class="welcome steps">
      <div><span>🧾</span><p><b>A bill is due Sunday night.</b></p></div>
      <div><span>💼</span><p><b>One job a day.</b> Your work, Ryde, or twenty-plus hustles.</p></div>
      <div><span>📱</span><p><b>Family is on WhatsApp.</b></p></div>
      <div><span>✅</span><p><b>Your life carries on</b> week after week.</p></div>
    </div>
    <button class="go" type="button" id="wgo">Choose my city</button>
    <p class="note">About 10 minutes a day. Sound on is best. 🔊</p>
    <button class="small-link" type="button" id="whow" style="background:none;border:0;text-decoration:underline">About and how to play</button>
    <button class="small-link" type="button" id="wcode" style="background:none;border:0;text-decoration:underline">Already playing somewhere else? Bring your weeks</button>`;
  $('over').hidden = false; track('welcome');
  $('wgo').onclick = () => { SND.init(); pickCity(); };
  $('wcode').onclick = () => pasteCodeBox();
  $('whow').onclick = () => $('help').click();
}
function pickCity(){
  const guess = (() => { try{ const d = JSON.parse(localStorage.getItem('nyhl-daily')||'null'); return d && ({us:'houston', uk:'london', ca:'toronto'})[d.rk]; }catch(e){ return null; } })();
  const btn = (k, flag, label, sub) => `<button class="city" type="button" data-c="${k}"><span class="fl" aria-hidden="true">${flag}</span><b>${label}</b><small>${sub}</small></button>`;
  const abroad = ['houston','london','toronto'].sort((a, b) => (b === guess) - (a === guess));
  const SUB = {houston:'Any state. Warehouse shifts, an old Corolla, and a car note.', london:'Any county. Care shifts, night buses, and rain that never stops.', toronto:'Any province. Factory shifts and winters at minus 20.'};
  $('obox').innerHTML = `<div class="eyebrow">STEP 1 OF 2</div><div class="big plain" style="font-size:clamp(28px,8vw,40px)">WHERE DO YOU LIVE?</div>
    <p>Pick your country, then your state, county, or province.</p>
    <div class="eyebrow" style="text-align:left;margin-top:6px">🇳🇬 Home</div>
    <div class="cities">${btn('ng', '🇳🇬', 'Nigeria', 'Any of the 36 states or Abuja. Go-slow, NEPA, owambe, and rent paid by the year.')}</div>
    <div class="eyebrow" style="text-align:left;margin-top:6px">🌍 Abroad</div>
    <div class="cities">${abroad.map(k => btn(k, COUNTRY[k].flag, COUNTRY[k].label, SUB[k])).join('')}</div>`;
  $('over').hidden = false;
  const start = (key, place) => {
    if(key === 'ng'){ const nc = ngCity(place); key = nc.key; P = freshLife(key); if(!NG_EXACT[place]){ P.place = place; } }
    else { P = freshLife(key); if(place && place !== COUNTRY[key].def){ P.place = place; const c = cityFor(key, place); P.cash = Math.round(700 * c.k / 5) * 5; } }
    if(P.place && CITIES[key].ng){ const c = cityFor(key, P.place); P.cash = Math.round(350 * c.k / 500) * 500; }
    save(); track('start-' + key + (P.place ? '-' + P.place : '')); pickMe();
  };
  $('obox').querySelectorAll('.city').forEach(b => b.onclick = () => {
    const key = b.dataset.c, co = COUNTRY[key];
    $('obox').querySelectorAll('.placepanel').forEach(x => x.remove());
    b.insertAdjacentHTML('afterend', `<div class="placepanel"><label class="eyebrow" for="placesel" style="text-align:left">${co.ask}</label><select id="placesel" class="select">${placeOptionsW(key)}</select><button class="go" type="button" id="placego">${key === 'ng' ? 'Live here' : 'Live in ' + ({houston:'the US', london:'the UK', toronto:'Canada'})[key]}</button></div>`);
    $('placego').onclick = () => start(key, $('placesel').value);
  });
}
function pickMe(){
  let who = P.me || '', life = P.fam || 'single';
  $('obox').innerHTML = `<div class="eyebrow">STEP 2 OF 2</div><div class="big plain" style="font-size:clamp(28px,8vw,40px)">WHO ARE YOU?</div>
    
    <div class="whoami">${Object.entries(ME).map(([k, m]) => `<button type="button" data-me="${k}"${k === who ? ' class="on"' : ''}><span aria-hidden="true">${m.base}</span>${m.label}</button>`).join('')}</div>
    <div class="eyebrow" style="text-align:left;margin-top:6px">YOUR HOME LIFE</div>
    <div class="whoami fam">${Object.entries(FAM).map(([k, [ic, l]]) => `<button type="button" data-fam="${k}"${k === life ? ' class="on"' : ''}><span aria-hidden="true">${ic}</span>${l}</button>`).join('')}</div>
    <p class="note" id="famnote"></p>
    <button class="go" type="button" id="mego"${who ? '' : ' disabled'}>Start my life</button>`;
  const NOTE = {single:'Just you. Your money is your own, mostly.', married:'Two incomes help a little. In-laws, anniversaries, and family meetings come with it.', kids:'School fees, school runs, excursions, and a house that is never quiet. Your partner chips in.', solo:'Everything on your shoulders: the children, the bills, and the school run.'};
  const paint = () => { $('obox').querySelectorAll('[data-me]').forEach(b => b.classList.toggle('on', b.dataset.me === who)); $('obox').querySelectorAll('[data-fam]').forEach(b => b.classList.toggle('on', b.dataset.fam === life)); $('famnote').textContent = NOTE[life]; $('mego').disabled = !who; };
  $('over').hidden = false; paint();
  $('obox').querySelectorAll('[data-me]').forEach(b => b.onclick = () => { who = b.dataset.me; paint(); });
  $('obox').querySelectorAll('[data-fam]').forEach(b => b.onclick = () => { life = b.dataset.fam; paint(); });
  $('mego').onclick = () => { if(!who) return; P.me = who; P.fam = life; save(); track('me-' + who + '-' + life); $('over').hidden = true; boot(); };
}
function doneToday(){
  const rec = P.hist[P.hist.length - 1];
  const ms = (() => { const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); return t - n; })();
  const h = Math.floor(ms / 36e5), mm = Math.floor(ms % 36e5 / 6e4);
  $('obox').innerHTML = `<div class="eyebrow">${C.flag} ${C.name.toUpperCase()} · YOU PLAYED TODAY</div>
    <div class="big ${rec && rec.pass ? 'win' : 'lose'}">${rec ? (rec.pass ? 'PASSED' : 'FAILED') : 'DONE'}</div>
    ${rec ? `<div class="sub">Week ${rec.w}: ${rec.title}</div>` : ''}
    <p>Week ${P.week}, <b>${missionFor(P.week).title}</b> (${money(missionFor(P.week).amount + P.arrears)}), unlocks in <b>${h}h ${mm}m</b>.</p>
    <div class="recap"><div><span>Cash carried over</span><span>${money(P.cash)}</span></div><div><span>Weeks lived</span><span>${P.hist.length}</span></div><div><span>Passed</span><span>${P.hist.filter(r => r.pass).length}</span></div><div><span>Streak</span><span>🔥 ${P.streak || 1}</span></div></div>
    <div class="prog">${[['🏅 Forklift lead', P.promo], ['🚗 Car fixed', P.car==='fixed'], ['💼 Office job', P.office], ['🏪 Own stall', P.stall]].map(([t, on]) => `<span class="${on ? 'on' : ''}">${on ? '' : '🔒 '}${t}</span>`).join('')}</div>
    ${rec ? '<button class="go" type="button" id="share">Share my week</button><div class="note" id="sharemsg"></div>' : ''}
    ${homeTipHTML()}
    <a class="small-link" href="/">Also from us: Now You Have Landed, a story game about life abroad</a>`;
  $('over').hidden = false;
  wireHomeTip();
  const s = $('share'); if(s) s.onclick = async () => { const t = shareText(rec); try{ if(navigator.share){ await navigator.share({text:t}); return; } }catch(e){ if(e && e.name === 'AbortError') return; } try{ await navigator.clipboard.writeText(t); $('sharemsg').textContent = 'Copied. Paste it in your group chat.'; }catch(e){ $('sharemsg').textContent = t; } };
}
function weekIntro(){
  const m = missionFor(P.week);
  $('obox').innerHTML = `<div class="eyebrow">${C.flag} ${C.name.toUpperCase()} · WEEK ${P.week}${P.streak > 1 ? ` · 🔥 ${P.streak}` : ''}</div>
    <div class="big plain">${m.title}</div>
    <p>${m.line()}</p>
    <div class="recap">
      <div><span>Due Sunday night</span><span>${money(m.amount)}</span></div>
      <div><span>${livingLabel()}</span><span>${money(living())}</span></div>
      ${P.ajo ? `<div><span>Ajo contribution</span><span>${money(ajoDue())}</span></div>` : ''}
      ${NG() && m.id !== 'renewal' && P.week >= 3 ? `<div><span>🏠 Yearly rent, week ${nextRenewal(P.week)}</span><span>${money(missionFor(nextRenewal(P.week)).amount)}</span></div>` : ''}
      ${P.arrears ? `<div><span>Arrears from last week</span><span>${money(P.arrears)}</span></div>` : ''}
      <div><span>You have</span><span>${money(P.cash)}</span></div>
      ${P.warnings ? `<div><span>Warnings</span><span>${Math.ceil(P.warnings)} of 3</span></div>` : ''}
    </div>
    ${newThisWeek().length ? `<div class="newmap"><b>New on your map this week</b>${newThisWeek().map(v => `<span>${v.ic} ${v.nm}</span>`).join('')}</div>` : ''}

    <button class="go" type="button" id="begin">Start Monday</button>`;
  $('over').hidden = false;
  $('begin').onclick = () => { $('over').hidden = true; track('play-w' + P.week); dayCard('MONDAY', () => { pins(); hud(); idle(); }); };
}
function boot(){
  C = cityFor(P.city, P.place);
  if(!P.me) return pickMe();
  if(P.evicted){ const keep = {lives:(P.lives||1) + 1, hist:P.hist, streak:P.streak, done:P.done, city:P.city, place:P.place, me:P.me, fam:P.fam}; P = Object.assign(freshLife(P.city), keep); P.cash = A(200); save(); toast('New start on a cousin\'s sofa. Your lessons came with you.'); }
  $('fm').textContent = `📻 ${NG() ? 'NAIJA' : 'JAPA'} FM ${C.fm}`;
  $('radio').textContent = shuffleL('radio', RADIO()).join('   ·   ');
  drawCity();
  if(P.done === today()){ freshWeek(); pins(); hud(); idle(); doneToday(); return; }
  if(P.wk && P.wk.date === today()){ W = P.wk.W; }   // pick up a week you started earlier today
  else { freshWeek(); }
  P.wk = {date:today(), W}; save();
  pins(); hud(); idle();
  if(W.day === 0 && W.slot === 0 && !W.started){ W.started = true; save(); weekIntro(); }
}
$('pins').addEventListener('click', e => { if(busy) return; const b = e.target.closest('.pin'); if(b){ SND.init(); SND.tap(); visit(b.dataset.k); } });
$('phone').onclick = () => { phone(); showSheet(); };
addEventListener('resize', () => C && drawCity());
window.__rentweek = () => ({W, P});   // read-only peek for the automated tests
P = store.get();
if(!P || !CITIES[P.city]) welcome(); else boot();
})();
</script>
